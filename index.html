<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Get Schwifty: Cromulon Attack</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: 400,
    height: 600,
    physics: {
        default: 'arcade',
        arcade: { 
            gravity: { y: 1000 }, // Гравитация для тарелки
            debug: false 
        }
    },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let cruiser; // Космическая тарелка Рика
let cromulons; // Группа летящих голов
let score = 0;
let scoreText;
let isGameOver = false;
let spawnTimer;

function preload() {
    // Когда найдешь картинки, просто раскомментируй эти строки:
    // this.load.image('cruiser', 'assets/space_cruiser.png');
    // this.load.image('cromulon', 'assets/cromulon.png');
}

function create() {
    isGameOver = false;
    score = 0;

    // Глубокий космический фон планеты Кромулон
    this.cameras.main.setBackgroundColor('#120124');
    
    // Эффект далеких звезд на фоне (простые точки)
    for (let i = 0; i < 30; i++) {
        this.add.circle(Phaser.Math.Between(0, 400), Phaser.Math.Between(0, 600), Phaser.Math.Between(1, 3), 0xffffff, 0.5);
    }

    // ИГРОК: Создаем космическую тарелку (пока в виде серебряного овала)
    cruiser = this.physics.add.ellipse(80, 300, 50, 25, 0xa9a9a9);
    cruiser.body.setCollideWorldBounds(true);
    // Делаем тарелку чуть более отзывчивой к физике
    cruiser.body.setDragY(100); 

    // ВРАГИ: Группа для голов Кромулонов
    cromulons = this.physics.add.group();

    // Спавн голов Кромулонов каждые 1.2 секунды
    spawnTimer = this.time.addEvent({
        delay: 1200,
        callback: spawnCromulon,
        callbackScope: this,
        loop: true
    });

    // УПРАВЛЕНИЕ: Тап по экрану дает тарелке импульс вверх (как реактивный двигатель)
    this.input.on('pointerdown', function () {
        if (isGameOver) return;
        cruiser.body.setVelocityY(-350);
        
        // Визуальный наклон тарелки вверх при взлете (если бы это был спрайт)
        cruiser.angle = -15;
    });

    // СЧЕТ
    scoreText = this.add.text(20, 20, 'SCORE: 0', { font: '22px Arial Black', fill: '#00ffcc' });

    // СТОЛКНОВЕНИЯ: Если тарелка врезается в Кромулона
    this.physics.add.overlap(cruiser, cromulons, gameOver, null, this);
}

function update() {
    if (isGameOver) return;

    // Плавный наклон тарелки вниз, когда она падает
    if (cruiser.body.velocity.y > 0 && cruiser.angle < 20) {
        cruiser.angle += 1;
    }

    // Если тарелка упала на землю или улетела в космос — проигрыш
    if (cruiser.y > 585 || cruiser.y < 15) {
        gameOver.call(this);
    }

    // Проверяем головы, которые улетели за левый край экрана, и начисляем очки
    cromulons.getChildren().forEach(cromulon => {
        if (!cromulon.scored && cromulon.x < cruiser.x) {
            cromulon.scored = true;
            score += 1;
            scoreText.setText('SCORE: ' + score);
            
            // Каждый 10 очков увеличиваем сложность (опционально)
        }
        
        // Удаляем голову, если она улетела далеко за экран, чтобы игра не лагала
        if (cromulon.x < -100) {
            cromulon.destroy();
        }
    });
}

function spawnCromulon() {
    if (isGameOver) return;

    // Случайная высота появления головы Кромулона
    const randomY = Phaser.Math.Between(50, 550);
    
    // Создаем голову (пока в виде огромного желто-коричневого круга)
    // В оригинале Кромулоны прямоугольно-овальные, сделаем размер 70x90
    let cromulon = this.physics.add.ellipse(450, randomY, 70, 90, 0xd2b48c);
    
    this.physics.add.existing(cromulon);
    cromulon.body.setAllowGravity(false); // Головы летят по воздуху, гравитация на них не действует
    
    // Скорость полета головы на игрока (от -220 до -300 для хаотичности)
    const randomSpeed = Phaser.Math.Between(-220, -320);
    cromulon.body.setVelocityX(randomSpeed);
    
    cromulon.scored = false;
    cromulons.add(cromulon);
}

function gameOver() {
    if (isGameOver) return;
    isGameOver = true;
    
    this.physics.pause();
    spawnTimer.destroy(); // Перестаем спавнить новые головы

    // Тарелка взрывается (краснеет)
    cruiser.setFillStyle(0xff0000); 

    // Легендарные фразы при проигрыше
    this.add.text(50, 250, 'BOO! NOT COOL!', { font: '36px Arial Black', fill: '#ff0055', stroke: '#000000', strokeThickness: 6 });
    this.add.text(85, 310, 'DISQUALIFIED!', { font: '24px Arial Black', fill: '#ffcc00', stroke: '#000000', strokeThickness: 4 });
    
    // Перезапуск через 2.5 секунды
    this.time.delayedCall(2500, () => {
        this.scene.restart();
    }, [], this);
}
</script>

</body>
</html>
