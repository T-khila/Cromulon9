<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Get Schwifty</title>
    <script src="https://telegram.org"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b001a; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Arial Black', sans-serif;
            touch-action: none;
        }
        #gameCanvas {
            background-color: #120026;
            box-shadow: 0 0 30px rgba(100, 0, 255, 0.3);
            border-radius: 12px;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }
        #hashModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Arial Black', sans-serif;
        }
        #hashModal.show { display: flex; }
        #hashModal .modal-box {
            background: #1d003b;
            border: 2px solid #ffffaa;
            border-radius: 14px;
            padding: 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 255, 170, 0.3);
        }
        #hashModal h2 { color: #ffdd00; margin: 0 0 10px 0; font-size: 26px; text-shadow: 0 0 15px rgba(255, 221, 0, 0.6); }
        #hashModal .subtitle { color: #88ff88; font-size: 14px; margin: 0 0 8px 0; }
        #hashModal .question { color: #ffffff; font-size: 13px; margin: 0 0 16px 0; line-height: 1.4; }
        #hashModal input {
            width: 100%; padding: 12px; font-size: 14px;
            font-family: 'Consolas', monospace;
            border-radius: 8px; border: 1px solid #ffffaa;
            background: #0b001a; color: #ffffaa;
            box-sizing: border-box; margin-bottom: 10px; outline: none;
        }
        #hashModal input:focus { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.4); }
        #hashModal button {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: bold; cursor: pointer;
            font-family: inherit; margin-bottom: 8px;
        }
        #hashModal .btn-submit { background: #00aa66; color: #ffffff; }
        #hashModal .btn-submit:disabled { background: #555555; cursor: wait; }
        #hashModal .btn-copy { background: #4a4ad0; color: #ffffff; display: none; }
        #hashModal .btn-close { background: #333333; color: #aaaaaa; font-size: 13px; }
        #hashModal .error { color: #ff5566; font-size: 13px; min-height: 18px; margin-bottom: 6px; }
        #hashModal .flag-result {
            display: none; color: #ffffaa;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-style: italic; font-size: 17px; margin-top: 12px;
            padding: 12px; background: rgba(255, 255, 170, 0.1);
            border: 1px dashed #ffffaa; border-radius: 8px;
            word-break: break-all;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<div id="hashModal">
    <div class="modal-box">
        <h2>🏆 VICTORY!</h2>
        <div class="subtitle">Ты убежал! Финальный счёт: <span id="finalScore">0</span></div>
        <p class="question">Для получения бонус-флага введите NTLM-хэш от УЗ <b>svc_backup</b>:</p>
        <input id="hashInput" type="text" placeholder="например: aad3b435b51404ee..." autocomplete="off" spellcheck="false">
        <div class="error" id="hashError"></div>
        <button class="btn-submit" id="submitHash">ПОЛУЧИТЬ ФЛАГ</button>
        <button class="btn-copy" id="copyFlag">📋 СКОПИРОВАТЬ ФЛАГ</button>
        <div class="flag-result" id="flagResult"></div>
        <button class="btn-close" id="closeModal">Закрыть</button>
    </div>
</div>

<script>
    const WORKER_URL = 'https://cromulon9-api.peters-s121.workers.dev/';

    (function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const W = canvas.width, H = canvas.height;

        const S_MENU = 101, S_PLAY = 202, S_OVER = 303, S_WIN = 404;
        const WIN_SCORE = 1000;
        const LASER_FIRE_INTERVAL = 1200;
        const MG_FIRE_INTERVAL = 200;
        const ROCKET_FIRE_INTERVAL = 1000;

        const BUFF_DURATIONS = {
            shield: 4000,
            rocket: 6000,
            laser: 6000,
            machinegun: 7000
        };

        const CROMULON_HP = 2;

        let gameState = S_MENU;
        let gameMode = 'flag';
        let score = 0;
        let lives = 3;
        let highScore = parseInt(localStorage.getItem('schwiftyHighScore')) || 0;
        let invincible = false, invincibleTimer = 0;
        let frameCount = 0;

        let shieldActive = false, shieldTimer = 0;
        let weaponTimers = { rocket: 0, laser: 0, machinegun: 0 };
        let nextShotTimes = { rocket: 0, laser: 0, machinegun: 0 };

        let thrustTimer = 0;

        let cromulonsPassed = 0;
        let nextBuffAt = 4 + Math.floor(Math.random() * 3);

        let meteorsEnabled = true;
        let lastToggleTime = 0;
        const meteorToggle = { x: W - 105, y: 72, w: 100, h: 26 };

        const cruiser = {
            x: 80, y: 250,
            width: 50, height: 30,
            velocityY: 0,
            gravity: 0.45,
            jump: -8,
            tilt: 0
        };

        let cromulons = [];
        let meteors = [];
        let powerups = [];
        let rockets = [];
        let bullets = [];
        let laserBeams = [];
        let explosions = [];
        let debris = [];
        let pickupFlashes = [];
        let lastSpawnCromulon = 0;
        let lastSpawnMeteor = 0;
        const CROMULON_DELAY = 1200;
        const METEOR_DELAY = 600;

        const stars = [];
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                size: Math.random() * 2.5 + 0.5,
                alpha: Math.random() * 0.6 + 0.2,
                speed: Math.random() * 0.2 + 0.05
            });
        }

        async function verifyHashOnServer(userHash) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hash: userHash }),
                });
                return await response.json();
            } catch (e) {
                return { error: 'Network error' };
            }
        }

        const hashModal = document.getElementById('hashModal');
        const hashInput = document.getElementById('hashInput');
        const hashError = document.getElementById('hashError');
        const submitHashBtn = document.getElementById('submitHash');
        const copyFlagBtn = document.getElementById('copyFlag');
        const flagResultEl = document.getElementById('flagResult');
        const closeModalBtn = document.getElementById('closeModal');
        const finalScoreEl = document.getElementById('finalScore');

        function showHashModal() {
            finalScoreEl.textContent = score;
            hashInput.value = '';
            hashInput.disabled = false;
            hashError.textContent = '';
            flagResultEl.style.display = 'none';
            flagResultEl.textContent = '';
            submitHashBtn.style.display = 'block';
            submitHashBtn.disabled = false;
            submitHashBtn.textContent = 'ПОЛУЧИТЬ ФЛАГ';
            copyFlagBtn.style.display = 'none';
            hashModal.classList.add('show');
            setTimeout(() => hashInput.focus(), 100);
        }

        function hideHashModal() {
            hashModal.classList.remove('show');
            gameState = S_MENU;
        }

        async function handleHashSubmit() {
            const userHash = hashInput.value.trim();
            if (!userHash) {
                hashError.textContent = 'Введите хэш';
                return;
            }
            submitHashBtn.disabled = true;
            submitHashBtn.textContent = 'ПРОВЕРКА...';
            hashError.textContent = '';
            const result = await verifyHashOnServer(userHash);
            submitHashBtn.disabled = false;
            submitHashBtn.textContent = 'ПОЛУЧИТЬ ФЛАГ';
            if (result.success && result.flag) {
                hashError.textContent = '';
                submitHashBtn.style.display = 'none';
                flagResultEl.textContent = result.flag;
                flagResultEl.style.display = 'block';
                copyFlagBtn.style.display = 'block';
                copyFlagBtn.textContent = '📋 СКОПИРОВАТЬ ФЛАГ';
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    try { window.Telegram.WebApp.HapticFeedback.notificationOccurred('success'); } catch(e) {}
                }
            } else {
                if (result.error === 'Wrong hash') {
                    hashError.textContent = '❌ Неверный хэш. Попробуйте ещё раз.';
                } else {
                    hashError.textContent = '⚠️ ' + (result.error || 'Ошибка сервера');
                }
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    try { window.Telegram.WebApp.HapticFeedback.notificationOccurred('error'); } catch(e) {}
                }
            }
        }

        submitHashBtn.addEventListener('click', handleHashSubmit);
        hashInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleHashSubmit(); });
        closeModalBtn.addEventListener('click', hideHashModal);
        copyFlagBtn.addEventListener('click', async () => {
            const text = flagResultEl.textContent;
            if (!text) return;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select();
                    document.execCommand('copy'); document.body.removeChild(ta);
                }
                copyFlagBtn.textContent = '✓ СКОПИРОВАНО';
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    try { window.Telegram.WebApp.HapticFeedback.notificationOccurred('success'); } catch(e) {}
                }
                setTimeout(() => { copyFlagBtn.textContent = '📋 СКОПИРОВАТЬ ФЛАГ'; }, 1500);
            } catch (e) {
                copyFlagBtn.textContent = '❌ ОШИБКА';
                setTimeout(() => { copyFlagBtn.textContent = '📋 СКОПИРОВАТЬ ФЛАГ'; }, 1500);
            }
        });

        function addScore(amount) {
            score += amount;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('schwiftyHighScore', highScore);
            }
            if (score >= WIN_SCORE && gameState === S_PLAY && gameMode === 'flag') {
                gameState = S_WIN;
                showHashModal();
            }
        }

        function spawnCromulon() {
            const maxY = H - 80;
            const speedBonus = Math.floor(score / 100) * 0.5;
            const baseSpeed = 3.5 + Math.random() * 1.5;
            cromulons.push({
                x: W + 30,
                y: Math.random() * maxY,
                width: 60, height: 80,
                speed: baseSpeed + speedBonus,
                scored: false,
                hp: CROMULON_HP,
                hitFlash: 0
            });
        }

        function spawnMeteor() {
            const fromLeft = Math.random() > 0.5;
            const startX = fromLeft ? -40 : W + 40;
            const startY = Math.random() * 150 - 50;
            const angle = fromLeft ? (Math.PI / 4 + Math.random() * 0.3) : (Math.PI * 3/4 - Math.random() * 0.3);
            const speed = 2.0 + Math.random() * 2.5;
            meteors.push({
                x: startX, y: startY,
                radius: 10 + Math.random() * 16,
                speedX: Math.cos(angle) * speed,
                speedY: Math.sin(angle) * speed,
            });
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function spawnPowerupPair() {
            const types = shuffleArray(['shield', 'rocket', 'laser', 'machinegun']);
            const type1 = types[0];
            const type2 = types[1];

            const y1 = 100 + Math.random() * (H - 220);
            let y2;
            let attempts = 0;
            do {
                y2 = 100 + Math.random() * (H - 220);
                attempts++;
            } while (Math.abs(y2 - y1) < 150 && attempts < 20);

            powerups.push({
                x: W + 80,
                y: y1,
                radius: 26,
                type: type1,
                angle: 0,
                speed: 2.2
            });
            powerups.push({
                x: W + 220,
                y: y2,
                radius: 26,
                type: type2,
                angle: 0,
                speed: 2.2
            });
        }

        function findNearestCromulon() {
            let target = null, minDist = Infinity;
            const px = cruiser.x + cruiser.width / 2;
            const py = cruiser.y + cruiser.height / 2;
            for (const c of cromulons) {
                const dx = (c.x + c.width / 2) - px;
                const dy = (c.y + c.height / 2) - py;
                const d = dx * dx + dy * dy;
                if (d < minDist) { minDist = d; target = c; }
            }
            return target;
        }

        function fireRocket(target) {
            rockets.push({
                x: cruiser.x + cruiser.width,
                y: cruiser.y + cruiser.height / 2,
                target: target,
                speed: 9,
                angle: 0
            });
        }

        function fireBullet() {
            bullets.push({
                x: cruiser.x + cruiser.width,
                y: cruiser.y + cruiser.height / 2,
                vx: 12, vy: 0
            });
        }

        function fireLaser() {
            const startX = cruiser.x + cruiser.width;
            const startY = cruiser.y + cruiser.height / 2;
            const endX = W;
            const halfWidthEnd = 34;
            const halfWidthStart = 6;

            for (let i = cromulons.length - 1; i >= 0; i--) {
                const c = cromulons[i];
                const points = [
                    { x: c.x,                y: c.y },
                    { x: c.x + c.width,      y: c.y },
                    { x: c.x,                y: c.y + c.height },
                    { x: c.x + c.width,      y: c.y + c.height },
                    { x: c.x + c.width / 2,  y: c.y + c.height / 2 }
                ];
                let hit = false;
                for (const p of points) {
                    if (p.x < startX) continue;
                    const t = Math.min((p.x - startX) / (endX - startX), 1);
                    const halfW = halfWidthStart + (halfWidthEnd - halfWidthStart) * t;
                    if (Math.abs(p.y - startY) <= halfW) { hit = true; break; }
                }
                if (hit) {
                    const ex = c.x + c.width / 2;
                    const ey = c.y + c.height / 2;
                    createExplosion(ex, ey);
                    if (!c.scored) {
                        c.scored = true;
                        addScore(10);
                    }
                    cromulons.splice(i, 1);
                }
            }
            laserBeams.push({ startX, startY, endX, halfWidthEnd, halfWidthStart, life: 1.0 });
        }

        function createExplosion(x, y) {
            explosions.push({ x: x, y: y, radius: 5, maxRadius: 55, life: 1.0 });
            for (let i = 0; i < 9; i++) {
                const angle = (Math.PI * 2 / 9) * i + Math.random() * 0.6;
                const speed = 2 + Math.random() * 3.5;
                debris.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 3 + Math.random() * 5,
                    life: 1.0,
                    color: Math.random() > 0.5 ? '#ff6622' : '#ffcc44'
                });
            }
        }

        function createHitSpark(x, y) {
            for (let i = 0; i < 3; i++) {
                debris.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    size: 2, life: 0.6,
                    color: '#ffff00'
                });
            }
        }

        function drawCruiser() {
            const x = cruiser.x, y = cruiser.y, w = cruiser.width, h = cruiser.height;
            const cx = x + w / 2, cy = y + h / 2;

            const glowIntensity = thrustTimer > 0 ? 1.0 : 0.45;
            const glowRadius = thrustTimer > 0 ? 42 : 26;
            const glowCenterY = y + h + 4;

            const grad = ctx.createRadialGradient(cx, glowCenterY, 0, cx, glowCenterY, glowRadius);
            grad.addColorStop(0, `rgba(0, 240, 255, ${0.9 * glowIntensity})`);
            grad.addColorStop(0.3, `rgba(0, 200, 255, ${0.6 * glowIntensity})`);
            grad.addColorStop(0.6, `rgba(0, 150, 255, ${0.25 * glowIntensity})`);
            grad.addColorStop(1, 'rgba(0, 150, 255, 0)');
            ctx.fillStyle = grad;
            ctx.save();
            ctx.translate(cx, glowCenterY);
            ctx.scale(1.6, 1.0);
            ctx.beginPath();
            ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const coreGrad = ctx.createRadialGradient(cx, y + h, 0, cx, y + h, glowRadius * 0.5);
            coreGrad.addColorStop(0, `rgba(180, 250, 255, ${0.9 * glowIntensity})`);
            coreGrad.addColorStop(0.5, `rgba(0, 220, 255, ${0.4 * glowIntensity})`);
            coreGrad.addColorStop(1, 'rgba(0, 180, 255, 0)');
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(cx, y + h, glowRadius * 0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(cruiser.tilt);
            ctx.translate(-cx, -cy);

            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 25;

            ctx.beginPath();
            ctx.ellipse(cx, cy + 4, w / 2 + 2, h / 2 - 2, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#3cb371';
            ctx.fill();
            ctx.strokeStyle = '#2e8b57';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(cx, cy - 6, 18, 14, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(100, 200, 255, 0.4)';
            ctx.fill();
            ctx.strokeStyle = '#88ddff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.shadowBlur = 5;
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx + 4, cy - 18);
            ctx.lineTo(cx + 8, cy - 28);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx + 8, cy - 30, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ff3333';
            ctx.fill();

            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ccff';
            ctx.beginPath();
            ctx.arc(cx - 4, cy - 4, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#aaddff';
            ctx.fill();
            ctx.strokeStyle = '#006699';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(cx - 8, cy - 8, 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fill();

            ctx.fillStyle = '#ff8800';
            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(x + 8, cy + 12, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + w - 8, cy + 12, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffaa';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(x + 4, cy + 2, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + w - 4, cy + 2, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }

        function drawShieldAroundPlayer() {
            const cx = cruiser.x + cruiser.width / 2;
            const cy = cruiser.y + cruiser.height / 2;
            const pulse = 1 + Math.sin(Date.now() / 100) * 0.08;
            const radius = 36 * pulse;
            const grad = ctx.createRadialGradient(cx, cy, radius * 0.3, cx, cy, radius);
            grad.addColorStop(0, 'rgba(0, 170, 255, 0)');
            grad.addColorStop(0.7, 'rgba(0, 170, 255, 0.15)');
            grad.addColorStop(1, 'rgba(120, 210, 255, 0.7)');
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = 'rgba(180, 230, 255, 0.9)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawCromulon(c) {
            const x = c.x, y = c.y, w = c.width, h = c.height;
            const cx = x + w / 2, cy = y + h / 2;

            ctx.save();
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 15;

            const baseColor = c.hitFlash > 0 ? '#ff9999' : (c.hp === 1 ? '#c84a2a' : '#e06040');

            ctx.beginPath();
            ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            ctx.strokeStyle = '#8b1a1a';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.shadowBlur = 5;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(cx - 16, cy - 8, 14, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 16, cy - 8, 14, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(cx - 18, cy - 6, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 18, cy - 6, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(cx - 20, cy - 10, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 16, cy - 10, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy + 10, 18, 0.1, Math.PI - 0.1);
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            for (let i = -12; i <= 12; i += 8) {
                ctx.beginPath();
                ctx.moveTo(cx + i - 3, cy + 6);
                ctx.lineTo(cx + i, cy + 16);
                ctx.lineTo(cx + i + 3, cy + 6);
                ctx.fill();
            }

            if (c.hp < CROMULON_HP) {
                ctx.shadowBlur = 0;
                for (let i = 0; i < CROMULON_HP; i++) {
                    ctx.beginPath();
                    ctx.arc(cx - 5 + i * 10, cy + h / 2 + 8, 3, 0, Math.PI * 2);
                    ctx.fillStyle = i < c.hp ? '#00ff88' : 'rgba(255,255,255,0.2)';
                    ctx.fill();
                }
            }

            ctx.restore();
            ctx.shadowBlur = 0;
        }

        function drawMeteor(m) {
            const x = m.x, y = m.y, r = m.radius;
            const angle = Math.atan2(m.speedY, m.speedX);
            ctx.save();
            const tailLen = r * 4.5;
            const grad = ctx.createRadialGradient(
                x, y, 0,
                x - Math.cos(angle) * tailLen * 0.4,
                y - Math.sin(angle) * tailLen * 0.4,
                tailLen
            );
            grad.addColorStop(0, 'rgba(255, 200, 50, 0.9)');
            grad.addColorStop(0.3, 'rgba(255, 120, 0, 0.6)');
            grad.addColorStop(0.7, 'rgba(255, 50, 0, 0.3)');
            grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(
                x - Math.cos(angle) * tailLen * 0.3,
                y - Math.sin(angle) * tailLen * 0.3,
                tailLen, r * 0.8, angle, 0, Math.PI * 2
            );
            ctx.fill();

            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#6b4a3c';
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#3d2b1f';
            ctx.beginPath();
            ctx.arc(x - r * 0.3, y - r * 0.2, r * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + r * 0.4, y + r * 0.3, r * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,220,180,0.3)';
            ctx.beginPath();
            ctx.arc(x - r * 0.2, y - r * 0.3, r * 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawPowerup(p) {
            ctx.save();
            ctx.translate(p.x, p.y);

            const pulse = 1 + Math.sin(Date.now() / 150 + p.x) * 0.1;
            const auraColor = p.type === 'shield' ? 'rgba(0, 170, 255, 0.15)'
                : p.type === 'rocket' ? 'rgba(255, 200, 0, 0.15)'
                : p.type === 'laser' ? 'rgba(0, 255, 100, 0.15)'
                : 'rgba(255, 100, 100, 0.15)';
            ctx.beginPath();
            ctx.arc(0, 0, (p.radius + 6) * pulse, 0, Math.PI * 2);
            ctx.fillStyle = auraColor;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, p.radius - 4, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.rotate(p.angle);

            if (p.type === 'shield') {
                ctx.shadowColor = '#00aaff';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#0088ff';
                ctx.beginPath();
                ctx.moveTo(0, -14);
                ctx.lineTo(11, -7);
                ctx.lineTo(11, 5);
                ctx.lineTo(0, 14);
                ctx.lineTo(-11, 5);
                ctx.lineTo(-11, -7);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#aaeeff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.save();
                ctx.rotate(Math.PI / 4);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.font = 'bold 10px "Arial Black", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('JET', 0, 0);
                ctx.restore();
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            } else if (p.type === 'rocket') {
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#cc6622';
                ctx.fillRect(-14, -5, 28, 10);
                ctx.strokeStyle = '#884422';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-14, -5, 28, 10);
                ctx.fillStyle = '#555555';
                ctx.fillRect(10, -9, 8, 18);
                ctx.strokeStyle = '#333333';
                ctx.strokeRect(10, -9, 8, 18);
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(14, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffdd44';
                ctx.fillRect(-10, -3, 4, 6);
                ctx.fillRect(0, -3, 4, 6);
            } else if (p.type === 'laser') {
                ctx.shadowColor = '#00ff66';
                ctx.shadowBlur = 25;
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(-14, -6, 24, 12);
                ctx.strokeStyle = '#555555';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-14, -6, 24, 12);
                ctx.fillStyle = '#666666';
                ctx.fillRect(10, -8, 5, 16);
                const blink = 0.5 + 0.5 * Math.sin(Date.now() / 80);
                ctx.fillStyle = `rgba(0, 255, 100, ${blink})`;
                ctx.fillRect(-10, -3, 20, 6);
                ctx.fillStyle = `rgba(200, 255, 200, ${blink})`;
                ctx.fillRect(-10, -1, 20, 2);
            } else if (p.type === 'machinegun') {
                ctx.shadowColor = '#ff5544';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#555555';
                ctx.fillRect(-6, -3, 22, 6);
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 1;
                ctx.strokeRect(-6, -3, 22, 6);
                ctx.fillStyle = '#4a4a4a';
                ctx.fillRect(-14, -8, 14, 16);
                ctx.strokeStyle = '#2a2a2a';
                ctx.strokeRect(-14, -8, 14, 16);
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(-12, 8, 8, 8);
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(14, -3, 3, 6);
                const mgBlink = Math.sin(Date.now() / 60) > 0 ? 0.9 : 0.4;
                ctx.fillStyle = `rgba(255, 200, 100, ${mgBlink})`;
                ctx.fillRect(-4, -1, 4, 2);
            }

            ctx.restore();
            ctx.shadowBlur = 0;
        }

        function drawRocket(r) {

        function drawLaserBeam(lb) {
            const { startX, startY, endX, halfWidthEnd, halfWidthStart, life } = lb;
            ctx.save();
            ctx.globalAlpha = life;
            const grad = ctx.createLinearGradient(startX, 0, endX, 0);
            grad.addColorStop(0, 'rgba(0, 255, 100, 0.95)');
            grad.addColorStop(0.5, 'rgba(0, 255, 100, 0.6)');
            grad.addColorStop(1, 'rgba(0, 255, 100, 0.1)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(startX, startY - halfWidthStart);
            ctx.lineTo(endX, startY - halfWidthEnd);
            ctx.lineTo(endX, startY + halfWidthEnd);
            ctx.lineTo(startX, startY + halfWidthStart);
            ctx.closePath();
            ctx.fill();
            ctx.shadowColor = '#00ff66';
            ctx.shadowBlur = 25;
            ctx.strokeStyle = `rgba(220, 255, 220, ${life})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, startY);
            ctx.stroke();
            ctx.restore();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function drawExplosion(e) {
            const alpha = e.life;
            const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
            grad.addColorStop(0, `rgba(255, 255, 220, ${alpha})`);
            grad.addColorStop(0.3, `rgba(255, 200, 50, ${alpha * 0.9})`);
            grad.addColorStop(0.6, `rgba(255, 100, 0, ${alpha * 0.6})`);
            grad.addColorStop(1, `rgba(255, 0, 0, 0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.fill();

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0b001a');
            grad.addColorStop(0.6, '#1d003b');
            grad.addColorStop(1, '#2a004a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            stars.forEach(star => {
                const flicker = 0.6 + 0.4 * Math.sin(frameCount * star.speed + star.x);
                ctx.globalAlpha = star.alpha * flicker;
                ctx.fillStyle = '#c8e6ff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            drawPlanet(90, 130);
            drawCyberCamp(320, 490);
        }

function drawCyberCamp(cx, cy) {
    ctx.save();
    ctx.globalAlpha = 0.8;

    const glow = ctx.createRadialGradient(cx, cy, 30, cx, cy, 120);
    glow.addColorStop(0, 'rgba(255, 100, 170, 0.4)');
    glow.addColorStop(0.6, 'rgba(180, 60, 160, 0.2)');
    glow.addColorStop(1, 'rgba(180, 60, 160, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, 120, 0, Math.PI * 2);
    ctx.fill();

    const bodyGrad = ctx.createRadialGradient(cx - 22, cy - 22, 5, cx, cy, 68);
    bodyGrad.addColorStop(0, 'rgba(240, 160, 220, 0.95)');
    bodyGrad.addColorStop(0.4, 'rgba(190, 70, 160, 0.92)');
    bodyGrad.addColorStop(1, 'rgba(70, 20, 90, 0.95)');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, 66, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(90, 30, 130, 0.5)';
    ctx.beginPath();
    ctx.ellipse(cx - 22, cy + 12, 16, 9, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 20, cy - 18, 20, 11, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 8, cy + 34, 13, 7, 0.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 180, 240, 0.5)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 84, 24, 0.3, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 180, 240, 0.22)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 94, 28, 0.3, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(180, 220, 255, 0.75)';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let row = 0; row < 2; row++) {
        const yBase = cy - 44 + row * 14;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
            const x = cx - 42 + i * 22;
            ctx.moveTo(x, yBase);
            ctx.lineTo(x + 9, yBase - 9);
            ctx.lineTo(x + 18, yBase);
        }
        ctx.stroke();
    }

    for (let row = 0; row < 2; row++) {
        const yBase = cy + 34 + row * 14;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
            const x = cx - 42 + i * 22;
            ctx.moveTo(x, yBase);
            ctx.lineTo(x + 9, yBase - 9);
            ctx.lineTo(x + 18, yBase);
        }
        ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
    ctx.font = 'bold 26px "Arial", sans-serif';
    ctx.fillText('cyber', cx, cy - 6);
    ctx.shadowColor = 'rgba(120, 220, 255, 0.7)';
    ctx.fillStyle = 'rgba(130, 225, 255, 0.98)';
    ctx.font = 'bold 26px "Arial", sans-serif';
    ctx.fillText('camp', cx, cy + 22);

    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;
}

        function resetGame() {
            score = 0;
            lives = 3;
            cruiser.y = 250;
            cruiser.velocityY = 0;
            cromulons = []; meteors = []; powerups = [];
            rockets = []; bullets = []; laserBeams = [];
            explosions = []; debris = []; pickupFlashes = [];
            lastSpawnCromulon = Date.now();
            lastSpawnMeteor = Date.now();
            invincible = false; invincibleTimer = 0;
            shieldActive = false; shieldTimer = 0;
            weaponTimers = { rocket: 0, laser: 0, machinegun: 0 };
            nextShotTimes = { rocket: 0, laser: 0, machinegun: 0 };
            thrustTimer = 0;
            cromulonsPassed = 0;
            nextBuffAt = 4 + Math.floor(Math.random() * 3);
            gameState = S_PLAY;
        }

        function loseLife() {
            lives--;
            if (lives <= 0) {
                gameState = S_OVER;
            } else {
                cruiser.y = 250;
                cruiser.velocityY = 0;
                invincible = true;
                invincibleTimer = 2000;
                cromulons = [];
                meteors = [];
                shieldActive = false;
                weaponTimers = { rocket: 0, laser: 0, machinegun: 0 };
                rockets = [];
                bullets = [];
            }
        }

        function update(timeScale, dt) {
            const now = Date.now();

            if (gameState === S_MENU) {
                cruiser.y = 280 + Math.sin(now / 250) * 12;
                cruiser.tilt = Math.sin(now / 300) * 0.1;
                updateEffects(timeScale);
                return;
            }

            if (gameState === S_PLAY) {
                if (thrustTimer > 0) thrustTimer -= dt;

                cruiser.velocityY += cruiser.gravity * timeScale;
                cruiser.y += cruiser.velocityY * timeScale;
                if (cruiser.y < 0) { cruiser.y = 0; cruiser.velocityY = 0; }
                if (cruiser.y + cruiser.height > H) {
                    loseLife();
                    if (gameState === S_OVER) return;
                }
                cruiser.tilt = cruiser.velocityY * 0.03;

                if (now - lastSpawnCromulon > CROMULON_DELAY) {
                    spawnCromulon();
                    lastSpawnCromulon = now;
                }
                if (meteorsEnabled && now - lastSpawnMeteor > METEOR_DELAY) {
                    spawnMeteor();
                    lastSpawnMeteor = now;
                }

                for (let i = cromulons.length - 1; i >= 0; i--) {
                    const c = cromulons[i];
                    c.x -= c.speed * timeScale;
                    if (c.hitFlash > 0) c.hitFlash -= timeScale;

                    if (!c.scored && c.x + c.width < cruiser.x) {
                        c.scored = true;
                        addScore(10);
                        if (gameState !== S_PLAY) return;
                        cromulonsPassed++;
                        if (cromulonsPassed >= nextBuffAt) {
                            spawnPowerupPair();
                            cromulonsPassed = 0;
                            nextBuffAt = 4 + Math.floor(Math.random() * 3);
                        }
                    }

                    if (!invincible &&
                        cruiser.x < c.x + c.width &&
                        cruiser.x + cruiser.width > c.x &&
                        cruiser.y < c.y + c.height &&
                        cruiser.y + cruiser.height > c.y) {
                        if (shieldActive) {
                            shieldActive = false;
                            shieldTimer = 0;
                            invincible = true;
                            invincibleTimer = 1000;
                            createExplosion(cruiser.x + cruiser.width / 2, cruiser.y + cruiser.height / 2);
                        } else {
                            loseLife();
                            if (gameState === S_OVER) return;
                        }
                    }

                    if (c.x < -100) cromulons.splice(i, 1);
                }

                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.x += m.speedX * timeScale;
                    m.y += m.speedY * timeScale;
                    if (m.x < -100 || m.x > W + 100 || m.y < -100 || m.y > H + 100) {
                        meteors.splice(i, 1);
                    }
                }

                for (let i = powerups.length - 1; i >= 0; i--) {
                    const p = powerups[i];
                    p.x -= p.speed * timeScale;
                    p.angle += 0.05 * timeScale;

                    const dx = (cruiser.x + cruiser.width / 2) - p.x;
                    const dy = (cruiser.y + cruiser.height / 2) - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const pickupRadius = p.radius * 0.8 + cruiser.width / 3;

                    if (dist < pickupRadius) {
                        if (p.type === 'shield') {
                            shieldActive = true;
                            shieldTimer = BUFF_DURATIONS.shield;
                        } else {
                            weaponTimers[p.type] = BUFF_DURATIONS[p.type];
                            nextShotTimes[p.type] = now;
                        }
                        const flashColor = p.type === 'shield' ? '#00ccff'
                            : p.type === 'rocket' ? '#ffcc00'
                            : p.type === 'laser' ? '#00ff66'
                            : '#ff5566';
                        pickupFlashes.push({
                            x: p.x, y: p.y,
                            radius: 10, maxRadius: 60, life: 1.0,
                            color: flashColor
                        });
                        powerups.splice(i, 1);
                    } else if (p.x < -60) {
                        powerups.splice(i, 1);
                    }
                }

                if (shieldActive) {
                    shieldTimer -= dt;
                    if (shieldTimer <= 0) { shieldActive = false; shieldTimer = 0; }
                }

                for (const type of ['rocket', 'laser', 'machinegun']) {
                    if (weaponTimers[type] > 0) {
                        weaponTimers[type] -= dt;
                        if (weaponTimers[type] <= 0) {
                            weaponTimers[type] = 0;
                        } else if (now >= nextShotTimes[type]) {
                            if (type === 'rocket') {
                                const target = findNearestCromulon();
                                if (target) {
                                    fireRocket(target);
                                    nextShotTimes[type] = now + ROCKET_FIRE_INTERVAL;
                                } else {
                                    nextShotTimes[type] = now + 200;
                                }
                            } else if (type === 'laser') {
                                fireLaser();
                                nextShotTimes[type] = now + LASER_FIRE_INTERVAL;
                            } else if (type === 'machinegun') {
                                fireBullet();
                                nextShotTimes[type] = now + MG_FIRE_INTERVAL;
                            }
                        }
                    }
                }

                for (let i = rockets.length - 1; i >= 0; i--) {
                    const r = rockets[i];
                    if (!cromulons.includes(r.target)) {
                        rockets.splice(i, 1);
                        continue;
                    }
                    const tx = r.target.x + r.target.width / 2;
                    const ty = r.target.y + r.target.height / 2;
                    const dx = tx - r.x;
                    const dy = ty - r.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    r.angle = Math.atan2(dy, dx);
                    if (dist < r.speed * timeScale) {
                        createExplosion(tx, ty);
                        if (!r.target.scored) {
                            r.target.scored = true;
                            addScore(10);
                            if (gameState !== S_PLAY) return;
                        }
                        const idx = cromulons.indexOf(r.target);
                        if (idx !== -1) cromulons.splice(idx, 1);
                        rockets.splice(i, 1);
                    } else {
                        r.x += (dx / dist) * r.speed * timeScale;
                        r.y += (dy / dist) * r.speed * timeScale;
                    }
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.x += b.vx * timeScale;
                    b.y += b.vy * timeScale;

                    const bx1 = b.x - 6, bx2 = b.x + 4;
                    const by1 = b.y - 2, by2 = b.y + 2;

                    let hit = false;
                    for (let j = cromulons.length - 1; j >= 0; j--) {
                        const c = cromulons[j];
                        if (bx1 < c.x + c.width && bx2 > c.x &&
                            by1 < c.y + c.height && by2 > c.y) {
                            c.hp -= 1;
                            c.hitFlash = 4;
                            createHitSpark(b.x, b.y);
                            hit = true;
                            if (c.hp <= 0) {
                                const cx = c.x + c.width / 2;
                                const cy = c.y + c.height / 2;
                                createExplosion(cx, cy);
                                if (!c.scored) {
                                    c.scored = true;
                                    addScore(10);
                                    if (gameState !== S_PLAY) return;
                                }
                                cromulons.splice(j, 1);
                            }
                            break;
                        }
                    }
                    if (hit || b.x > W + 20) {
                        bullets.splice(i, 1);
                    }
                }

                for (let i = laserBeams.length - 1; i >= 0; i--) {
                    laserBeams[i].life -= 0.08 * timeScale;
                    if (laserBeams[i].life <= 0) laserBeams.splice(i, 1);
                }

                if (invincible) {
                    invincibleTimer -= dt;
                    if (invincibleTimer <= 0) {
                        invincible = false;
                        invincibleTimer = 0;
                    }
                }
            }

            updateEffects(timeScale);
        }

        function updateEffects(timeScale) {
            if (!timeScale) timeScale = 1;
            for (let i = explosions.length - 1; i >= 0; i--) {
                const e = explosions[i];
                e.radius += (e.maxRadius - e.radius) * 0.18 * timeScale;
                e.life -= 0.05 * timeScale;
                if (e.life <= 0) explosions.splice(i, 1);
            }
            for (let i = debris.length - 1; i >= 0; i--) {
                const d = debris[i];
                d.x += d.vx * timeScale;
                d.y += d.vy * timeScale;
                d.vx *= Math.pow(0.97, timeScale);
                d.vy *= Math.pow(0.97, timeScale);
                d.vy += 0.12 * timeScale;
                d.life -= 0.018 * timeScale;
                if (d.life <= 0) debris.splice(i, 1);
            }
            for (let i = pickupFlashes.length - 1; i >= 0; i--) {
                const f = pickupFlashes[i];
                f.radius += (f.maxRadius - f.radius) * 0.2 * timeScale;
                f.life -= 0.06 * timeScale;
                if (f.life <= 0) pickupFlashes.splice(i, 1);
            }
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            drawBackground();

            meteors.forEach(m => drawMeteor(m));
            cromulons.forEach(c => drawCromulon(c));

            powerups.forEach(p => drawPowerup(p));
            rockets.forEach(r => drawRocket(r));
            bullets.forEach(b => drawBullet(b));
            laserBeams.forEach(lb => drawLaserBeam(lb));

            if (gameState !== S_WIN) {
                if (shieldActive) drawShieldAroundPlayer();
                if (!(gameState === S_PLAY && invincible && Math.floor(Date.now() / 150) % 2 === 0)) {
                    drawCruiser();
                }
            } else {
                if (shieldActive) drawShieldAroundPlayer();
                drawCruiser();
            }

            explosions.forEach(e => drawExplosion(e));
            debris.forEach(d => drawDebrisPiece(d));
            pickupFlashes.forEach(f => drawPickupFlash(f));

            if (gameState === S_MENU) {
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ffdd00';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 36px "Arial Black", sans-serif';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.strokeText('PLANET MUSIC', W / 2, 170);
                ctx.fillText('PLANET MUSIC', W / 2, 170);

                ctx.shadowBlur = 10;
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 20px "Arial Black", sans-serif';
                ctx.strokeText('CROMULON ATTACK', W / 2, 215);
                ctx.fillText('CROMULON ATTACK', W / 2, 215);

                const btn1X = 55, btn1Y = 355, btn1W = 290, btn1H = 60;
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.roundRect(btn1X, btn1Y, btn1W, btn1H, 12);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ff88aa';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px "Arial Black", sans-serif';
                ctx.fillText('🏁 FLAG MODE', W / 2, btn1Y + 30);
                ctx.fillStyle = '#ffccdd';
                ctx.font = '11px Arial';
                ctx.fillText('1000 очков → получить флаг', W / 2, btn1Y + 48);

                const btn2X = 55, btn2Y = 435, btn2W = 290, btn2H = 60;
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#00ccff';
                ctx.fillStyle = '#0066cc';
                ctx.beginPath();
                ctx.roundRect(btn2X, btn2Y, btn2W, btn2H, 12);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#88ddff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px "Arial Black", sans-serif';
                ctx.fillText('♾️ INFINITY MODE', W / 2, btn2Y + 30);
                ctx.fillStyle = '#cceeff';
                ctx.font = '11px Arial';
                ctx.fillText('Бесконечная игра на очки', W / 2, btn2Y + 48);

                ctx.fillStyle = '#aaaaaa';
                ctx.font = '13px Arial';
                ctx.fillText('Tap / Space', W / 2, 535);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';

                drawMeteorToggle();
                return;
            }

            ctx.textAlign = 'left';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#000000';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px "Arial Black", sans-serif';
            ctx.fillText('SCORE: ' + score, 15, 35);
            ctx.fillStyle = '#ffcc00';
            ctx.fillText('BEST: ' + highScore, 15, 60);

            ctx.fillStyle = gameMode === 'flag' ? '#ff66aa' : '#66ccff';
            ctx.font = 'bold 13px "Arial Black", sans-serif';
            ctx.fillText(gameMode === 'flag' ? '🏁 FLAG' : '♾️ INFINITY', 15, 80);

            for (let i = 0; i < lives; i++) {
                ctx.fillStyle = '#ff3344';
                ctx.font = '24px Arial';
                ctx.fillText('❤️', W - 30 - i * 30, 40);
            }

            let iconY = 110;
            if (shieldActive) {
                drawBuffIcon(15, iconY, 'shield', shieldTimer / BUFF_DURATIONS.shield);
                iconY += 32;
            }
            for (const type of ['rocket', 'laser', 'machinegun']) {
                if (weaponTimers[type] > 0) {
                    drawBuffIcon(15, iconY, type, weaponTimers[type] / BUFF_DURATIONS[type]);
                    iconY += 32;
                }
            }
            ctx.shadowBlur = 0;

            drawMeteorToggle();

            if (gameState === S_OVER) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0033';
                ctx.fillStyle = '#ff0033';
                ctx.font = 'bold 40px "Arial Black", sans-serif';
                ctx.fillText('💀 BOO!', W / 2, 230);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 24px "Arial Black", sans-serif';
                ctx.fillText('DISQUALIFIED', W / 2, 290);
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px Arial';
                ctx.fillText('Score: ' + score, W / 2, 340);
                ctx.fillStyle = '#aaaaaa';
                ctx.font = '16px Arial';
                ctx.fillText('Tap / Space to retry', W / 2, 500);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };
        }

        function startFlagMode() {
            gameMode = 'flag';
            resetGame();
        }

        function startInfinityMode() {
            gameMode = 'infinity';
            resetGame();
        }

        function jump() {
            if (gameState === S_PLAY) {
                cruiser.velocityY = cruiser.jump;
                thrustTimer = 300;
            }
        }

        function hitMeteorToggle(touchX, touchY) {
            const t = meteorToggle;
            return touchX >= t.x && touchX <= t.x + t.w &&
                   touchY >= t.y && touchY <= t.y + t.h;
        }

        function handlePointer(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const touchX = (e.clientX - rect.left) * scaleX;
            const touchY = (e.clientY - rect.top) * scaleY;

            if (hitMeteorToggle(touchX, touchY)) {
                const t = Date.now();
                if (t - lastToggleTime < 250) return;
                lastToggleTime = t;
                meteorsEnabled = !meteorsEnabled;
                if (!meteorsEnabled) meteors = [];
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    try { window.Telegram.WebApp.HapticFeedback.impactOccurred('light'); } catch(err) {}
                }
                return;
            }

            if (gameState === S_MENU) {
                if (touchX >= 55 && touchX <= 345 && touchY >= 355 && touchY <= 415) {
                    startFlagMode();
                } else if (touchX >= 55 && touchX <= 345 && touchY >= 435 && touchY <= 495) {
                    startInfinityMode();
                }
            } else if (gameState === S_PLAY) {
                jump();
            } else if (gameState === S_OVER) {
                gameState = S_MENU;
            }
        }

        canvas.addEventListener('pointerdown', handlePointer);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (touch) {
                const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY, preventDefault: () => {} };
                handlePointer(fakeEvent);
            }
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ') {
                if (hashModal.classList.contains('show')) return;
                e.preventDefault();
                if (gameState === S_MENU) {
                    startFlagMode();
                } else if (gameState === S_PLAY) {
                    jump();
                } else if (gameState === S_OVER) {
                    gameState = S_MENU;
                }
            } else if (e.code === 'ArrowUp' || e.key === 'ArrowUp') {
                if (hashModal.classList.contains('show')) return;
                e.preventDefault();
                jump();
            } else if (e.code === 'KeyM' || e.key === 'm' || e.key === 'M' || e.key === 'ь') {
                meteorsEnabled = !meteorsEnabled;
                if (!meteorsEnabled) meteors = [];
            }
        });

        let lastFrameTime = performance.now();

        function gameLoop(now) {
            now = now || performance.now();
            let dt = now - lastFrameTime;
            lastFrameTime = now;
            if (dt > 100) dt = 100;
            const timeScale = dt / 16.6667;

            frameCount++;
            update(timeScale, dt);
            render();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
