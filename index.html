<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Get Schwifty - Cromulon Attack</title>
    <script src="https://telegram.org"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b001a; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Arial Black', sans-serif;
            touch-action: none;
        }
        #gameCanvas {
            background-color: #120026;
            box-shadow: 0 0 30px rgba(100, 0, 255, 0.3);
            border-radius: 12px;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    // ============================================================
    // ЗАМЕНИТЕ НА URL ВАШЕГО WORKER'А
    // ============================================================
    const WORKER_URL = 'https://cromulon9-api.peters-s121.workers.dev/';

    (function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const W = canvas.width, H = canvas.height;

        // ============================================================
        // Состояния
        // ============================================================
        const S_MENU = 101, S_PLAY = 202, S_OVER = 303, S_WIN = 404;
        const WIN_SCORE = 1000;

        let gameState = S_MENU;
        let score = 0;
        let lives = 3;
        let highScore = parseInt(localStorage.getItem('schwiftyHighScore')) || 0;
        let invincible = false, invincibleTimer = 0;
        let frameCount = 0;

        // Флаг
        let WIN_FLAG_TEXT = '...';
        let copyFeedbackTimer = 0;

        // Бафы
        let shieldActive = false, shieldTimer = 0;
        let weaponActive = false, weaponTimer = 0;
        let nextShotTime = 0;
        const BUFF_DURATION = 5000;

        // Счётчик для спавна бафов
        let cromulonsPassed = 0;
        let nextBuffAt = 7 + Math.floor(Math.random() * 4);

        // ============================================================
        // Игрок
        // ============================================================
        const cruiser = {
            x: 80, y: 250,
            width: 50, height: 30,
            velocityY: 0,
            gravity: 0.45,
            jump: -8,
            tilt: 0
        };

        // ============================================================
        // Массивы объектов
        // ============================================================
        let cromulons = [];
        let meteors = [];
        let powerups = [];
        let rockets = [];
        let explosions = [];
        let debris = [];
        let pickupFlashes = [];
        let lastSpawnCromulon = 0;
        let lastSpawnMeteor = 0;
        const CROMULON_DELAY = 1200;
        const METEOR_DELAY = 600;

        const stars = [];
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                size: Math.random() * 2.5 + 0.5,
                alpha: Math.random() * 0.6 + 0.2,
                speed: Math.random() * 0.2 + 0.05
            });
        }

        // ============================================================
        // Запрос флага
        // ============================================================
        async function claimFlagFromServer() {
            try {
                const initData = window.Telegram?.WebApp?.initData;
                if (!initData) return null;
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData, score }),
                });
                if (!response.ok) return null;
                const data = await response.json();
                return data.flag || null;
            } catch (e) { return null; }
        }

        function copyFlagToClipboard() {
            const text = WIN_FLAG_TEXT;
            const markDone = () => {
                copyFeedbackTimer = Date.now();
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    try { window.Telegram.WebApp.HapticFeedback.notificationOccurred('success'); } catch(e) {}
                }
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(markDone).catch(() => {
                    fallbackCopy(text); markDone();
                });
            } else { fallbackCopy(text); markDone(); }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.focus(); ta.select();
            try { document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
        }

        // ============================================================
        // Подсчёт очков + проверка победы
        // ============================================================
        function addScore(amount) {
            score += amount;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('schwiftyHighScore', highScore);
            }
            if (score >= WIN_SCORE && gameState === S_PLAY) {
                gameState = S_WIN;
                copyFeedbackTimer = 0;
                WIN_FLAG_TEXT = 'Загрузка...';
                claimFlagFromServer().then(flag => {
                    WIN_FLAG_TEXT = flag || 'Ошибка загрузки';
                });
            }
        }

        // ============================================================
        // Спавн объектов
        // ============================================================
        function spawnCromulon() {
            const maxY = H - 80;
            const speedBonus = Math.floor(score / 100) * 0.5;
            const baseSpeed = 3.5 + Math.random() * 1.5;
            cromulons.push({
                x: W + 30,
                y: Math.random() * maxY,
                width: 60, height: 80,
                speed: baseSpeed + speedBonus,
                scored: false
            });
        }

        function spawnMeteor() {
            const fromLeft = Math.random() > 0.5;
            const startX = fromLeft ? -40 : W + 40;
            const startY = Math.random() * 150 - 50;
            const angle = fromLeft ? (Math.PI / 4 + Math.random() * 0.3) : (Math.PI * 3/4 - Math.random() * 0.3);
            const speed = 2.0 + Math.random() * 2.5;
            meteors.push({
                x: startX, y: startY,
                radius: 10 + Math.random() * 16,
                speedX: Math.cos(angle) * speed,
                speedY: Math.sin(angle) * speed,
            });
        }

        function spawnPowerup() {
            const type = Math.random() > 0.5 ? 'shield' : 'weapon';
            powerups.push({
                x: W + 80,                             // спавн далеко за экраном
                y: 100 + Math.random() * (H - 220),
                radius: 26,
                type: type,
                angle: 0,
                speed: 2.2,                            // медленнее, чтобы можно было успеть
                collected: false
            });
        }

        // ============================================================
        // Ракеты и взрывы
        // ============================================================
        function findNearestCromulon() {
            let target = null, minDist = Infinity;
            const px = cruiser.x + cruiser.width / 2;
            const py = cruiser.y + cruiser.height / 2;
            for (const c of cromulons) {
                const dx = (c.x + c.width / 2) - px;
                const dy = (c.y + c.height / 2) - py;
                const d = dx * dx + dy * dy;
                if (d < minDist) { minDist = d; target = c; }
            }
            return target;
        }

        function fireRocket(target) {
            rockets.push({
                x: cruiser.x + cruiser.width,
                y: cruiser.y + cruiser.height / 2,
                target: target,
                speed: 9,
                angle: 0
            });
        }

        function createExplosion(x, y) {
            explosions.push({
                x: x, y: y,
                radius: 5, maxRadius: 55,
                life: 1.0
            });
            for (let i = 0; i < 9; i++) {
                const angle = (Math.PI * 2 / 9) * i + Math.random() * 0.6;
                const speed = 2 + Math.random() * 3.5;
                debris.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 3 + Math.random() * 5,
                    life: 1.0,
                    color: Math.random() > 0.5 ? '#ff6622' : '#ffcc44'
                });
            }
        }

        // ============================================================
        // Рисование
        // ============================================================
        function drawCruiser() {
            const x = cruiser.x, y = cruiser.y, w = cruiser.width, h = cruiser.height;
            const cx = x + w / 2, cy = y + h / 2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(cruiser.tilt);
            ctx.translate(-cx, -cy);

            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 25;

            ctx.beginPath();
            ctx.ellipse(cx, cy + 4, w / 2 + 2, h / 2 - 2, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#3cb371';
            ctx.fill();
            ctx.strokeStyle = '#2e8b57';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(cx, cy - 6, 18, 14, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(100, 200, 255, 0.4)';
            ctx.fill();
            ctx.strokeStyle = '#88ddff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.shadowBlur = 5;
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx + 4, cy - 18);
            ctx.lineTo(cx + 8, cy - 28);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx + 8, cy - 30, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ff3333';
            ctx.fill();

            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ccff';
            ctx.beginPath();
            ctx.arc(cx - 4, cy - 4, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#aaddff';
            ctx.fill();
            ctx.strokeStyle = '#006699';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(cx - 8, cy - 8, 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fill();

            ctx.fillStyle = '#ff8800';
            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(x + 8, cy + 12, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + w - 8, cy + 12, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffaa';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(x + 4, cy + 2, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + w - 4, cy + 2, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }

        function drawShieldAroundPlayer() {
            const cx = cruiser.x + cruiser.width / 2;
            const cy = cruiser.y + cruiser.height / 2;
            const pulse = 1 + Math.sin(Date.now() / 100) * 0.08;
            const radius = 36 * pulse;

            const grad = ctx.createRadialGradient(cx, cy, radius * 0.3, cx, cy, radius);
            grad.addColorStop(0, 'rgba(0, 170, 255, 0)');
            grad.addColorStop(0.7, 'rgba(0, 170, 255, 0.15)');
            grad.addColorStop(1, 'rgba(120, 210, 255, 0.7)');

            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = 'rgba(180, 230, 255, 0.9)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawCromulon(c) {
            const x = c.x, y = c.y, w = c.width, h = c.height;
            const cx = x + w / 2, cy = y + h / 2;

            ctx.save();
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#e06040';
            ctx.fill();
            ctx.strokeStyle = '#8b1a1a';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.shadowBlur = 5;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(cx - 16, cy - 8, 14, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 16, cy - 8, 14, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(cx - 18, cy - 6, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 18, cy - 6, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(cx - 20, cy - 10, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 16, cy - 10, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy + 10, 18, 0.1, Math.PI - 0.1);
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            for (let i = -12; i <= 12; i += 8) {
                ctx.beginPath();
                ctx.moveTo(cx + i - 3, cy + 6);
                ctx.lineTo(cx + i, cy + 16);
                ctx.lineTo(cx + i + 3, cy + 6);
                ctx.fill();
            }
            ctx.restore();
            ctx.shadowBlur = 0;
        }

        function drawMeteor(m) {
            const x = m.x, y = m.y, r = m.radius;
            const angle = Math.atan2(m.speedY, m.speedX);
            ctx.save();
            const tailLen = r * 4.5;
            const grad = ctx.createRadialGradient(
                x, y, 0,
                x - Math.cos(angle) * tailLen * 0.4,
                y - Math.sin(angle) * tailLen * 0.4,
                tailLen
            );
            grad.addColorStop(0, 'rgba(255, 200, 50, 0.9)');
            grad.addColorStop(0.3, 'rgba(255, 120, 0, 0.6)');
            grad.addColorStop(0.7, 'rgba(255, 50, 0, 0.3)');
            grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(
                x - Math.cos(angle) * tailLen * 0.3,
                y - Math.sin(angle) * tailLen * 0.3,
                tailLen, r * 0.8, angle, 0, Math.PI * 2
            );
            ctx.fill();

            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#6b4a3c';
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#3d2b1f';
            ctx.beginPath();
            ctx.arc(x - r * 0.3, y - r * 0.2, r * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + r * 0.4, y + r * 0.3, r * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,220,180,0.3)';
            ctx.beginPath();
            ctx.arc(x - r * 0.2, y - r * 0.3, r * 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // -------- Power-up --------
        function drawPowerup(p) {
            ctx.save();
            ctx.translate(p.x, p.y);

            // Пульсирующий внешний ореол
            const pulse = 1 + Math.sin(Date.now() / 150 + p.x) * 0.1;
            ctx.beginPath();
            ctx.arc(0, 0, (p.radius + 6) * pulse, 0, Math.PI * 2);
            ctx.fillStyle = p.type === 'shield'
                ? 'rgba(0, 170, 255, 0.15)'
                : 'rgba(255, 200, 0, 0.15)';
            ctx.fill();

            // Прозрачный белый круг
            ctx.beginPath();
            ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Внутренняя тонкая окружность
            ctx.beginPath();
            ctx.arc(0, 0, p.radius - 4, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Вращающийся контент
            ctx.rotate(p.angle);

            if (p.type === 'shield') {
                ctx.shadowColor = '#00aaff';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#0088ff';
                ctx.beginPath();
                ctx.moveTo(0, -14);
                ctx.lineTo(11, -7);
                ctx.lineTo(11, 5);
                ctx.lineTo(0, 14);
                ctx.lineTo(-11, 5);
                ctx.lineTo(-11, -7);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#aaeeff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.beginPath();
                ctx.moveTo(0, -8);
                ctx.lineTo(6, -4);
                ctx.lineTo(6, 3);
                ctx.lineTo(0, 8);
                ctx.lineTo(-6, 3);
                ctx.lineTo(-6, -4);
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#cc6622';
                ctx.fillRect(-14, -5, 28, 10);
                ctx.strokeStyle = '#884422';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-14, -5, 28, 10);
                ctx.fillStyle = '#555555';
                ctx.fillRect(10, -9, 8, 18);
                ctx.strokeStyle = '#333333';
                ctx.strokeRect(10, -9, 8, 18);
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(14, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffdd44';
                ctx.fillRect(-10, -3, 4, 6);
                ctx.fillRect(0, -3, 4, 6);
            }

            ctx.restore();
            ctx.shadowBlur = 0;
        }

        // -------- Ракета --------
        function drawRocket(r) {
            ctx.save();
            ctx.translate(r.x, r.y);
            ctx.rotate(r.angle);

            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 20;
            const grad = ctx.createLinearGradient(-30, 0, 0, 0);
            grad.addColorStop(0, 'rgba(255, 100, 0, 0)');
            grad.addColorStop(0.5, 'rgba(255, 180, 0, 0.6)');
            grad.addColorStop(1, 'rgba(255, 240, 100, 0.9)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(-14, 0, 16, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 10;
            ctx.fillStyle = '#cccccc';
            ctx.fillRect(-8, -3, 16, 6);
            ctx.strokeStyle = '#666666';
            ctx.lineWidth = 1;
            ctx.strokeRect(-8, -3, 16, 6);

            ctx.fillStyle = '#ff3333';
            ctx.beginPath();
            ctx.moveTo(8, -3);
            ctx.lineTo(13, 0);
            ctx.lineTo(8, 3);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#888888';
            ctx.beginPath();
            ctx.moveTo(-8, -3);
            ctx.lineTo(-11, -6);
            ctx.lineTo(-8, -3);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-8, 3);
            ctx.lineTo(-11, 6);
            ctx.lineTo(-8, 3);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
            ctx.shadowBlur = 0;
        }

        // -------- Взрыв --------
        function drawExplosion(e) {
            const alpha = e.life;
            const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
            grad.addColorStop(0, `rgba(255, 255, 220, ${alpha})`);
            grad.addColorStop(0.3, `rgba(255, 200, 50, ${alpha * 0.9})`);
            grad.addColorStop(0.6, `rgba(255, 100, 0, ${alpha * 0.6})`);
            grad.addColorStop(1, `rgba(255, 0, 0, 0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // -------- Обломки --------
        function drawDebrisPiece(d) {
            ctx.globalAlpha = d.life;
            ctx.shadowColor = d.color;
            ctx.shadowBlur = 8;
            ctx.fillStyle = d.color;
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.size * d.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }

        // -------- Вспышка подбора --------
        function drawPickupFlash(f) {
            ctx.globalAlpha = f.life;
            ctx.strokeStyle = f.color;
            ctx.lineWidth = 4;
            ctx.shadowColor = f.color;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }

        // -------- HUD: иконки бафов --------
        function drawBuffIcon(x, y, type, fraction) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x + 12, y + 12, 14, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x + 12, y + 12, 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * fraction);
            ctx.strokeStyle = type === 'shield' ? '#00ccff' : '#ffcc00';
            ctx.lineWidth = 3;
            ctx.stroke();

            if (type === 'shield') {
                ctx.fillStyle = '#00aaff';
                ctx.beginPath();
                ctx.moveTo(x + 12, y + 5);
                ctx.lineTo(x + 20, y + 9);
                ctx.lineTo(x + 20, y + 16);
                ctx.lineTo(x + 12, y + 20);
                ctx.lineTo(x + 4, y + 16);
                ctx.lineTo(x + 4, y + 9);
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(x + 5, y + 10, 14, 4);
                ctx.fillStyle = '#555';
                ctx.fillRect(x + 17, y + 8, 3, 8);
            }
            ctx.restore();
        }

        // -------- Фон --------
        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0b001a');
            grad.addColorStop(0.6, '#1d003b');
            grad.addColorStop(1, '#2a004a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            stars.forEach(star => {
                const flicker = 0.6 + 0.4 * Math.sin(frameCount * star.speed + star.x);
                ctx.globalAlpha = star.alpha * flicker;
                ctx.fillStyle = '#c8e6ff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.globalAlpha = 0.08;
            ctx.fillStyle = '#aa66ff';
            ctx.beginPath();
            ctx.arc(60, 80, 120, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff66aa';
            ctx.beginPath();
            ctx.arc(340, 500, 100, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        // ============================================================
        // Логика
        // ============================================================
        function resetGame() {
            score = 0;
            lives = 3;
            cruiser.y = 250;
            cruiser.velocityY = 0;
            cromulons = []; meteors = []; powerups = [];
            rockets = []; explosions = []; debris = [];
            pickupFlashes = [];
            lastSpawnCromulon = Date.now();
            lastSpawnMeteor = Date.now();
            invincible = false; invincibleTimer = 0;
            copyFeedbackTimer = 0;
            WIN_FLAG_TEXT = '...';
            shieldActive = false; shieldTimer = 0;
            weaponActive = false; weaponTimer = 0;
            cromulonsPassed = 0;
            nextBuffAt = 7 + Math.floor(Math.random() * 4);
            gameState = S_PLAY;
        }

        function loseLife() {
            lives--;
            if (lives <= 0) {
                gameState = S_OVER;
            } else {
                cruiser.y = 250;
                cruiser.velocityY = 0;
                invincible = true;
                invincibleTimer = 2000;
                cromulons = [];
                meteors = [];
                shieldActive = false;
                weaponActive = false;
                rockets = [];
            }
        }

        function update() {
            const now = Date.now();

            if (gameState === S_MENU) {
                cruiser.y = 280 + Math.sin(now / 250) * 12;
                cruiser.tilt = Math.sin(now / 300) * 0.1;
                updateEffects();
                return;
            }

            if (gameState === S_PLAY) {
                // --- Физика игрока ---
                cruiser.velocityY += cruiser.gravity;
                cruiser.y += cruiser.velocityY;
                if (cruiser.y < 0) { cruiser.y = 0; cruiser.velocityY = 0; }
                if (cruiser.y + cruiser.height > H) {
                    loseLife();
                    if (gameState === S_OVER) return;
                }
                cruiser.tilt = cruiser.velocityY * 0.03;

                // --- Спавн ---
                if (now - lastSpawnCromulon > CROMULON_DELAY) {
                    spawnCromulon();
                    lastSpawnCromulon = now;
                }
                if (now - lastSpawnMeteor > METEOR_DELAY) {
                    spawnMeteor();
                    lastSpawnMeteor = now;
                }

                // --- Кромулоны ---
                for (let i = cromulons.length - 1; i >= 0; i--) {
                    const c = cromulons[i];
                    c.x -= c.speed;

                    if (!c.scored && c.x + c.width < cruiser.x) {
                        c.scored = true;
                        addScore(10);
                        if (gameState !== S_PLAY) return;
                        cromulonsPassed++;
                        if (cromulonsPassed >= nextBuffAt) {
                            spawnPowerup();
                            cromulonsPassed = 0;
                            nextBuffAt = 7 + Math.floor(Math.random() * 4);
                        }
                    }

                    // Столкновение с игроком
                    if (!invincible &&
                        cruiser.x < c.x + c.width &&
                        cruiser.x + cruiser.width > c.x &&
                        cruiser.y < c.y + c.height &&
                        cruiser.y + cruiser.height > c.y) {
                        if (shieldActive) {
                            shieldActive = false;
                            shieldTimer = 0;
                            invincible = true;
                            invincibleTimer = 1000;
                            createExplosion(cruiser.x + cruiser.width / 2, cruiser.y + cruiser.height / 2);
                        } else {
                            loseLife();
                            if (gameState === S_OVER) return;
                        }
                    }

                    if (c.x < -100) cromulons.splice(i, 1);
                }

                // --- Метеориты (декор) ---
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.x += m.speedX;
                    m.y += m.speedY;
                    if (m.x < -100 || m.x > W + 100 || m.y < -100 || m.y > H + 100) {
                        meteors.splice(i, 1);
                    }
                }

                // --- Паверапы ---
                for (let i = powerups.length - 1; i >= 0; i--) {
                    const p = powerups[i];
                    p.x -= p.speed;
                    p.angle += 0.05;

                    // Проверка подбора: игрок должен КАСАТЬСЯ бафа
                    const dx = (cruiser.x + cruiser.width / 2) - p.x;
                    const dy = (cruiser.y + cruiser.height / 2) - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const pickupRadius = p.radius * 0.8 + cruiser.width / 3;

                    if (dist < pickupRadius) {
                        // Баф подобран — применяем
                        if (p.type === 'shield') {
                            shieldActive = true;
                            shieldTimer = BUFF_DURATION;
                        } else {
                            weaponActive = true;
                            weaponTimer = BUFF_DURATION;
                            nextShotTime = now;
                        }
                        pickupFlashes.push({
                            x: p.x, y: p.y,
                            radius: 10,
                            maxRadius: 60,
                            life: 1.0,
                            color: p.type === 'shield' ? '#00ccff' : '#ffcc00'
                        });
                        powerups.splice(i, 1);
                    }
                    // Улетел за экран без подбора — просто исчезает
                    else if (p.x < -60) {
                        powerups.splice(i, 1);
                    }
                }

                // --- Таймеры бафов ---
                if (shieldActive) {
                    shieldTimer -= 16;
                    if (shieldTimer <= 0) { shieldActive = false; shieldTimer = 0; }
                }
                if (weaponActive) {
                    weaponTimer -= 16;
                    if (weaponTimer <= 0) {
                        weaponActive = false; weaponTimer = 0;
                    } else if (now >= nextShotTime) {
                        const target = findNearestCromulon();
                        if (target) {
                            fireRocket(target);
                            nextShotTime = now + 1000;
                        }
                    }
                }

                // --- Ракеты ---
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const r = rockets[i];
                    if (!cromulons.includes(r.target)) {
                        rockets.splice(i, 1);
                        continue;
                    }
                    const tx = r.target.x + r.target.width / 2;
                    const ty = r.target.y + r.target.height / 2;
                    const dx = tx - r.x;
                    const dy = ty - r.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    r.angle = Math.atan2(dy, dx);

                    if (dist < r.speed) {
                        createExplosion(tx, ty);
                        if (!r.target.scored) {
                            addScore(10);
                            if (gameState !== S_PLAY) return;
                            r.target.scored = true;
                        }
                        const idx = cromulons.indexOf(r.target);
                        if (idx !== -1) cromulons.splice(idx, 1);
                        rockets.splice(i, 1);
                    } else {
                        r.x += (dx / dist) * r.speed;
                        r.y += (dy / dist) * r.speed;
                    }
                }

                // --- Неуязвимость ---
                if (invincible) {
                    invincibleTimer -= 16;
                    if (invincibleTimer <= 0) {
                        invincible = false;
                        invincibleTimer = 0;
                    }
                }
            }

            updateEffects();
        }

        function updateEffects() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const e = explosions[i];
                e.radius += (e.maxRadius - e.radius) * 0.18;
                e.life -= 0.05;
                if (e.life <= 0) explosions.splice(i, 1);
            }
            for (let i = debris.length - 1; i >= 0; i--) {
                const d = debris[i];
                d.x += d.vx;
                d.y += d.vy;
                d.vx *= 0.97;
                d.vy *= 0.97;
                d.vy += 0.12;
                d.life -= 0.018;
                if (d.life <= 0) debris.splice(i, 1);
            }
            for (let i = pickupFlashes.length - 1; i >= 0; i--) {
                const f = pickupFlashes[i];
                f.radius += (f.maxRadius - f.radius) * 0.2;
                f.life -= 0.06;
                if (f.life <= 0) pickupFlashes.splice(i, 1);
            }
        }

        // ============================================================
        // Рендеринг
        // ============================================================
        function render() {
            ctx.clearRect(0, 0, W, H);
            drawBackground();

            meteors.forEach(m => drawMeteor(m));

            if (gameState !== S_WIN) {
                cromulons.forEach(c => drawCromulon(c));
            }

            if (gameState === S_PLAY) {
                powerups.forEach(p => drawPowerup(p));
                rockets.forEach(r => drawRocket(r));
            }

            if (gameState !== S_WIN) {
                if (shieldActive) drawShieldAroundPlayer();
                if (!(gameState === S_PLAY && invincible && Math.floor(Date.now() / 150) % 2 === 0)) {
                    drawCruiser();
                }
            }

            explosions.forEach(e => drawExplosion(e));
            debris.forEach(d => drawDebrisPiece(d));
            pickupFlashes.forEach(f => drawPickupFlash(f));

            // --- Меню ---
            if (gameState === S_MENU) {
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ffdd00';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 36px "Arial Black", sans-serif';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.strokeText('PLANET MUSIC', W / 2, 190);
                ctx.fillText('PLANET MUSIC', W / 2, 190);

                ctx.shadowBlur = 10;
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 20px "Arial Black", sans-serif';
                ctx.strokeText('CROMULON ATTACK', W / 2, 235);
                ctx.fillText('CROMULON ATTACK', W / 2, 235);

                const btnX = 80, btnY = 390, btnW = 240, btnH = 60;
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.roundRect(btnX, btnY, btnW, btnH, 12);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px "Arial Black", sans-serif';
                ctx.fillText('START SHOW', W / 2, btnY + 40);

                ctx.fillStyle = '#aaaaaa';
                ctx.font = '14px Arial';
                ctx.fillText('Tap or click', W / 2, 500);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                return;
            }

            // --- HUD ---
            ctx.textAlign = 'left';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#000000';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px "Arial Black", sans-serif';
            ctx.fillText('SCORE: ' + score, 15, 35);
            ctx.fillStyle = '#ffcc00';
            ctx.fillText('BEST: ' + highScore, 15, 60);

            for (let i = 0; i < lives; i++) {
                ctx.fillStyle = '#ff3344';
                ctx.font = '24px Arial';
                ctx.fillText('❤️', W - 30 - i * 30, 40);
            }

            let iconY = 85;
            if (shieldActive) {
                drawBuffIcon(15, iconY, 'shield', shieldTimer / BUFF_DURATION);
                iconY += 32;
            }
            if (weaponActive) {
                drawBuffIcon(15, iconY, 'weapon', weaponTimer / BUFF_DURATION);
            }

            ctx.shadowBlur = 0;

            // --- GAME OVER ---
            if (gameState === S_OVER) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0033';
                ctx.fillStyle = '#ff0033';
                ctx.font = 'bold 40px "Arial Black", sans-serif';
                ctx.fillText('💀 BOO!', W / 2, 230);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 24px "Arial Black", sans-serif';
                ctx.fillText('DISQUALIFIED', W / 2, 290);
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px Arial';
                ctx.fillText('Score: ' + score, W / 2, 340);
                ctx.fillStyle = '#aaaaaa';
                ctx.font = '16px Arial';
                ctx.fillText('Tap anywhere to retry', W / 2, 500);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }

            // --- VICTORY ---
            if (gameState === S_WIN) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center';

                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ffdd00';
                ctx.fillStyle = '#ffdd00';
                ctx.font = 'bold 46px "Arial Black", sans-serif';
                ctx.fillText('🏆 VICTORY!', W / 2, 150);

                ctx.shadowBlur = 10;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 26px "Arial Black", sans-serif';
                ctx.fillText('Ты убежал!', W / 2, 200);

                ctx.fillStyle = '#88ff88';
                ctx.font = 'bold 18px "Arial", sans-serif';
                ctx.fillText('Бонусный флаг:', W / 2, 250);

                ctx.fillStyle = '#cccccc';
                ctx.font = '14px Arial';
                ctx.fillText('Финальный счёт: ' + score, W / 2, 280);

                const flagBoxX = 25, flagBoxY = 315, flagBoxW = 270, flagBoxH = 50;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffffaa';
                ctx.fillStyle = 'rgba(255, 255, 170, 0.12)';
                ctx.strokeStyle = '#ffffaa';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(flagBoxX, flagBoxY, flagBoxW, flagBoxH, 10);
                ctx.fill();
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffaa';
                ctx.font = 'italic 20px "Comic Sans MS", cursive, sans-serif';
                ctx.fillText(WIN_FLAG_TEXT, flagBoxX + flagBoxW / 2, flagBoxY + 33);

                const copyX = 305, copyY = 315, copyW = 70, copyH = 50;
                const isCopied = copyFeedbackTimer && (Date.now() - copyFeedbackTimer < 1500);
                ctx.shadowBlur = 15;
                ctx.shadowColor = isCopied ? '#33ff88' : '#8888ff';
                ctx.fillStyle = isCopied ? '#22aa55' : '#4a4ad0';
                ctx.beginPath();
                ctx.roundRect(copyX, copyY, copyW, copyH, 10);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = isCopied ? '#88ffaa' : '#aaaaff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px Arial';
                ctx.fillText('📋', copyX + copyW / 2, copyY + 27);
                ctx.font = 'bold 9px Arial';
                ctx.fillText(isCopied ? '✓ OK' : 'COPY', copyX + copyW / 2, copyY + 44);

                if (isCopied) {
                    ctx.fillStyle = '#88ff88';
                    ctx.font = 'bold 14px Arial';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#00ff44';
                    ctx.fillText('✓ Скопировано', copyX + copyW / 2, copyY + copyH + 20);
                    ctx.shadowBlur = 0;
                }

                const okX = 130, okY = 440, okW = 140, okH = 55;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ff88';
                ctx.fillStyle = '#00aa66';
                ctx.beginPath();
                ctx.roundRect(okX, okY, okW, okH, 14);
                ctx.fill();
                ctx.strokeStyle = '#88ffcc';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 26px "Arial Black", sans-serif';
                ctx.fillText('OK', W / 2, okY + 38);

                ctx.fillStyle = '#888888';
                ctx.font = '12px Arial';
                ctx.fillText('Нажми OK, чтобы вернуться в меню', W / 2, 530);

                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }
        }

        // Полифилл roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };
        }

        // ============================================================
        // Управление
        // ============================================================
        function handlePointer(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const touchX = (e.clientX - rect.left) * scaleX;
            const touchY = (e.clientY - rect.top) * scaleY;

            if (gameState === S_MENU) {
                if (touchX >= 80 && touchX <= 320 && touchY >= 390 && touchY <= 450) resetGame();
            } else if (gameState === S_PLAY) {
                cruiser.velocityY = cruiser.jump;
            } else if (gameState === S_OVER) {
                gameState = S_MENU;
            } else if (gameState === S_WIN) {
                if (touchX >= 305 && touchX <= 375 && touchY >= 315 && touchY <= 365) {
                    copyFlagToClipboard();
                } else if (touchX >= 130 && touchX <= 270 && touchY >= 440 && touchY <= 495) {
                    gameState = S_MENU;
                    copyFeedbackTimer = 0;
                }
            }
        }

        canvas.addEventListener('pointerdown', handlePointer);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (touch) {
                const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY, preventDefault: () => {} };
                handlePointer(fakeEvent);
            }
        }, { passive: false });

        function gameLoop() {
            frameCount++;
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    })();
</script>
