<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Get Schwifty</title>
    <script src="https://telegram.org"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #1d003b; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        #gameCanvas {
            background-color: #120026;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
// Интеграция с Telegram
if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
}

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Состояние игры
let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
let score = 0;

// Игрок (Тарелка Рика)
let cruiser = {
    x: 80, y: 250,
    width: 50, height: 30,
    velocityY: 0,
    gravity: 0.4,
    jump: -7.5
};

// Препятствия (Кромулоны)
let cromulons = [];
let lastSpawnTime = 0;
let spawnDelay = 1300; 

// Звезды на фоне
let stars = [];
for (let i = 0; i < 40; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        alpha: Math.random() * 0.5 + 0.3
    });
}

// Обработка кликов/тапов
canvas.addEventListener("pointerdown", (e) => {
    if (gameState === "MENU") {
        // Проверяем клик по кнопке START SHOW (центр: 200, y: 420, размеры: 240x60)
        let rect = canvas.getBoundingClientRect();
        let clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
        let clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
        
        if (clickX >= 80 && clickX <= 320 && clickY >= 390 && clickY <= 450) {
            resetGame();
            gameState = "PLAYING";
        }
    } else if (gameState === "PLAYING") {
        cruiser.velocityY = cruiser.jump;
    } else if (gameState === "GAMEOVER") {
        gameState = "MENU";
    }
});

function resetGame() {
    score = 0;
    cruiser.y = 250;
    cruiser.velocityY = 0;
    cromulons = [];
    lastSpawnTime = Date.now();
}

// Главный игровой цикл
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

function update() {
    let now = Date.now();

    if (gameState === "MENU") {
        // Плавное покачивание тарелки в меню
        cruiser.y = 280 + Math.sin(now / 200) * 10;
    } 
    
    else if (gameState === "PLAYING") {
        // Физика тарелки
        cruiser.velocityY += cruiser.gravity;
        cruiser.y += cruiser.velocityY;

        // Ограничения экрана
        if (cruiser.y < 0) { cruiser.y = 0; cruiser.velocityY = 0; }
        if (cruiser.y + cruiser.height > canvas.height) {
            gameState = "GAMEOVER";
        }

        // Спавн Кромулонов
        if (now - lastSpawnTime > spawnDelay) {
            cromulons.push({
                x: canvas.width + 50,
                y: Math.random() * (canvas.height - 150) + 50,
                width: 70, height: 95,
                speed: 4,
                scored: false
            });
            lastSpawnTime = now;
        }

        // Движение Кромулонов
        for (let i = cromulons.length - 1; i >= 0; i--) {
            let c = cromulons[i];
            c.x -= c.speed;

            // Подсчет очков
            if (!c.scored && c.x < cruiser.x) {
                c.scored = true;
                score++;
            }

            // Проверка столкновения (AABB collision)
            if (cruiser.x < c.x + c.width &&
                cruiser.x + cruiser.width > c.x &&
                cruiser.y < c.y + c.height &&
                cruiser.y + cruiser.height > c.y) {
                gameState = "GAMEOVER";
            }

            // Удаление улетевших
            if (c.x < -100) cromulons.splice(i, 1);
        }
    }
}

function render() {
    // Очистка экрана
    ctx.fillStyle = "#1d003b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Рисуем звезды
    ctx.fillStyle = "#00ffcc";
    stars.forEach(star => {
        ctx.globalAlpha = star.alpha;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // РЕНДЕР МЕНЮ
    if (gameState === "MENU") {
        // Голова Кромулона на фоне
        ctx.fillStyle = "#d2b48c";
        ctx.beginPath();
        ctx.ellipse(200, 140, 55, 70, 0, 0, Math.PI * 2);
        ctx.fill();
        // Глаза Кромулона
        ctx.fillStyle = "#000000";
        ctx.font = "bold 24px Arial";
        ctx.fillText("•  •", 183, 135);

        // Название игры
        ctx.fillStyle = "#ffff00";
        ctx.font = "bold 32px Arial Black";
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 5;
        ctx.strokeText("PLANET MUSIC", 65, 250);
        ctx.fillText("PLANET MUSIC", 65, 250);

        ctx.fillStyle = "#00ffcc";
        ctx.font = "bold 18px Arial Black";
        ctx.strokeText("CROMULON ATTACK", 95, 290);
        ctx.fillText("CROMULON ATTACK", 95, 290);

        // Кнопка START SHOW
        ctx.fillStyle = "#ff0055";
        ctx.fillRect(80, 390, 240, 60);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px Arial";
        ctx.fillText("START SHOW", 135, 427);
    }

    // РЕНДЕР ИГРЫ
    if (gameState === "PLAYING" || gameState === "GAMEOVER") {
        // Рисуем Кромулонов (Красные головы-блоки)
        ctx.fillStyle = "#ff0055";
        cromulons.forEach(c => {
            ctx.fillRect(c.x, c.y, c.width, c.height);
            // Простые глазки на блоках, чтобы были похожи на головы
            ctx.fillStyle = "#000000";
            ctx.fillRect(c.x + 15, c.y + 20, 8, 8);
            ctx.fillRect(c.x + 45, c.y + 20, 8, 8);
            ctx.fillStyle = "#ff0055";
        });

        // Рисуем счет
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 22px Arial";
        ctx.fillText("SCORE: " + score, 20, 40);
    }

    // Рисуем игрока (Желтая космическая тарелка)
    ctx.fillStyle = "#ffff00";
    ctx.fillRect(cruiser.x, cruiser.y, cruiser.width, cruiser.height);
    // Иллюминатор тарелки
    ctx.fillStyle = "#00ffff";
    ctx.fillRect(cruiser.x + 15, cruiser.y + 5, 20, 10);

    // РЕНДЕР GAME OVER
    if (gameState === "GAMEOVER") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff0033";
        ctx.font = "bold 34px Arial Black";
        ctx.fillText("BOO! NOT COOL!", 45, 260);

        ctx.fillStyle = "#ffcc00";
        ctx.font = "bold 20px Arial";
        ctx.fillText("DISQUALIFIED", 130, 310);
        
        ctx.fillStyle = "#ffffff";
        ctx.font = "14px Arial";
        ctx.fillText("Tap anywhere to retry", 130, 500);
    }
}

// Запуск игры
gameLoop();
</script>

</body>
</html>
