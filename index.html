<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Get Schwifty: Cromulon Attack</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: 400,
    height: 600,
    physics: {
        default: 'arcade',
        arcade: { 
            gravity: { y: 900 }, 
            debug: false 
        }
    },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let cruiser; 
let cromulons; 
let score = 0;
let scoreText;
let isGameOver = false;
let isGameStarted = false; // Флаг: запущена ли игра из меню
let spawnTimer;

// Элементы меню
let menuContainer;
let bgStars = [];

function preload() {}

function create() {
    isGameOver = false;
    isGameStarted = false;
    score = 0;

    // Глубокий фиолетовый космический фон сцены
    this.cameras.main.setBackgroundColor('#1d003b');
    
    // Генерируем красивые неоновые звезды
    for (let i = 0; i < 40; i++) {
        let star = this.add.circle(Phaser.Math.Between(0, 400), Phaser.Math.Between(0, 600), Phaser.Math.Between(2, 3), 0x00ffcc, 0.4);
        bgStars.push(star);
    }

    // ИГРОК: Создаем космическую тарелку (яркий ЖЕЛТЫЙ блок)
    cruiser = this.physics.add.rectangle(100, 250, 45, 45, 0xffff00);
    cruiser.body.setCollideWorldBounds(true);
    cruiser.body.setDragY(50); 
    cruiser.body.setAllowGravity(false); // Отключаем гравитацию, пока мы в меню

    // ВРАГИ: Группа для Кромулонов
    cromulons = this.physics.add.group();

    // СЧЕТ (скрыт, пока мы в меню)
    scoreText = this.add.text(20, 20, 'SCORE: 0', { font: '22px Arial Black', fill: '#ffffff' });
    scoreText.setVisible(false);

    // СТОЛКНОВЕНИЯ
    this.physics.add.overlap(cruiser, cromulons, gameOver, null, this);

    // УПРАВЛЕНИЕ: Тап по экрану во время игры
    this.input.on('pointerdown', function (pointer) {
        if (!isGameStarted || isGameOver) return;
        cruiser.body.setVelocityY(-380); // Прыжок вверх
    });

    // --- СОЗДАЕМ ИНТЕРФЕЙС ГЛАВНОГО МЕНЮ ---
    menuContainer = this.add.container(0, 0);

    // Огромная голова Кромулона на фоне меню (Бежевый овал)
    let menuCromulon = this.add.ellipse(200, 140, 110, 140, 0xd2b48c).setAlpha(0.7);
    let cromulonEyes = this.add.text(175, 110, '•  •', { font: '32px Arial Black', fill: '#000000' });
    
    // Текст названия шоу
    let titleText = this.add.text(65, 250, 'PLANET MUSIC', { font: '34px Arial Black', fill: '#ffff00', stroke: '#000000', strokeThickness: 6 });
    let subtitleText = this.add.text(90, 300, 'CROMULON ATTACK', { font: '20px Arial Black', fill: '#00ffcc', stroke: '#000000', strokeThickness: 4 });

    // Кнопка СТАРТ (Интерактивная зона)
    let startButtonBg = this.add.rectangle(200, 420, 240, 60, 0xff0055).setInteractive({ useHandCursor: true });
    let startButtonText = this.add.text(125, 402, 'START SHOW', { font: '22px Arial Black', fill: '#ffffff' });

    // Добавляем всё в контейнер меню, чтобы потом легко спрятать одной командой
    menuContainer.add([menuCromulon, cromulonEyes, titleText, subtitleText, startButtonBg, startButtonText]);

    // Логика нажатия на кнопку СТАРТ
    startButtonBg.on('pointerdown', () => {
        startGame.call(this);
    });
}

function startGame() {
    isGameStarted = true;
    
    // Прячем стартовое меню
    menuContainer.setVisible(false);
    
    // Включаем физику, счет и гравитацию для тарелки Рика
    scoreText.setVisible(true);
    cruiser.body.setAllowGravity(true);
    cruiser.body.setVelocityY(-300); // Сразу даем небольшой импульс вверх при старте

    // Запускаем таймер появления Кромулонов
    spawnTimer = this.time.addEvent({
        delay: 1300,
        callback: spawnCromulon,
        callbackScope: this,
        loop: true
    });
}

function update() {
    if (!isGameStarted || isGameOver) {
        // Эффект плавного парения тарелки Рика в главном меню вверх-вниз
        if (!isGameStarted) {
            cruiser.y = 350 + Math.sin(this.time.now / 200) * 10;
        }
        return;
    }

    // Проверяем Кромулонов и считаем очки
    cromulons.getChildren().forEach(cromulon => {
        if (!cromulon.scored && cromulon.x < cruiser.x) {
            cromulon.scored = true;
            score += 1;
            scoreText.setText('SCORE: ' + score);
        }
        if (cromulon.x < -100) {
            cromulon.destroy();
        }
    });
}

function spawnCromulon() {
    if (isGameOver) return;

    const randomY = Phaser.Math.Between(60, 540);
    
    // Препятствие: Летящие головы Кромулонов (Красные блоки)
    let cromulon = this.physics.add.rectangle(450, randomY, 65, 85, 0xff0055);
    
    this.physics.add.existing(cromulon);
    cromulon.body.setAllowGravity(false); 
    cromulon.body.setVelocityX(-240); 
    
    cromulon.scored = false;
    cromulons.add(cromulon);
}

function gameOver() {
    if (isGameOver) return;
    isGameOver = true;
    
    this.physics.pause();
    if (spawnTimer) spawnTimer.destroy();

    cruiser.setFillStyle(0xff0000); 

    // Фирменный проигрыш
    this.add.text(40, 240, 'BOO! NOT COOL!', { font: '36px Arial Black', fill: '#ff0033', stroke: '#000000', strokeThickness: 5 });
    this.add.text(100, 300, 'DISQUALIFIED', { font: '22px Arial Black', fill: '#ffcc00', stroke: '#000000', strokeThickness: 4 });
    
    // Перезапуск всей сцены (возврат в главное меню) через 2.5 секунды
    this.time.delayedCall(2500, () => {
        this.scene.restart();
    }, [], this);
}
</script>

</body>
</html>
