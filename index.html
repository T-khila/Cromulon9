<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Get Schwifty - победа при 1000</title>
    <script src="https://telegram.org"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b001a; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Arial Black', sans-serif;
            touch-action: none;
        }
        #gameCanvas {
            background-color: #120026;
            box-shadow: 0 0 30px rgba(100, 0, 255, 0.3);
            border-radius: 12px;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    // ============================================================
    // Интеграция с Telegram
    // ============================================================
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;

    // ============================================================
    // Состояния игры
    // ============================================================
    const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2, WIN: 3 };
    let gameState = STATE.MENU;
    let score = 0;
    let lives = 3;
    let highScore = parseInt(localStorage.getItem('schwiftyHighScore')) || 0;
    let invincible = false;
    let invincibleTimer = 0;
    let frameCount = 0;

    // ============================================================
    // Игрок (тарелка Рика)
    // ============================================================
    const cruiser = {
        x: 80, y: 250,
        width: 50, height: 30,
        velocityY: 0,
        gravity: 0.45,
        jump: -8,
        tilt: 0
    };

    // ============================================================
    // Препятствия и декорации
    // ============================================================
    let cromulons = [];
    let meteors = [];
    let lastSpawnCromulon = 0;
    let lastSpawnMeteor = 0;
    const CROMULON_DELAY = 1200;   // мс
    const METEOR_DELAY = 600;

    // ============================================================
    // Фон
    // ============================================================
    const stars = [];
    for (let i = 0; i < 60; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 2.5 + 0.5,
            alpha: Math.random() * 0.6 + 0.2,
            speed: Math.random() * 0.2 + 0.05
        });
    }

    // ============================================================
    // Рисование в стиле Рика и Морти
    // ============================================================

    function drawCruiser() {
        const x = cruiser.x, y = cruiser.y, w = cruiser.width, h = cruiser.height;
        const cx = x + w/2, cy = y + h/2;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(cruiser.tilt);
        ctx.translate(-cx, -cy);

        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 25;

        // Корпус
        ctx.beginPath();
        ctx.ellipse(cx, cy + 4, w/2 + 2, h/2 - 2, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#3cb371';
        ctx.fill();
        ctx.strokeStyle = '#2e8b57';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Купол
        ctx.beginPath();
        ctx.ellipse(cx, cy - 6, 18, 14, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(100, 200, 255, 0.4)';
        ctx.fill();
        ctx.strokeStyle = '#88ddff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Антенна
        ctx.shadowBlur = 5;
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx + 4, cy - 18);
        ctx.lineTo(cx + 8, cy - 28);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx + 8, cy - 30, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ff3333';
        ctx.fill();

        // Иллюминатор
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00ccff';
        ctx.beginPath();
        ctx.arc(cx - 4, cy - 4, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#aaddff';
        ctx.fill();
        ctx.strokeStyle = '#006699';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(cx - 8, cy - 8, 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fill();

        // Огни
        ctx.fillStyle = '#ff8800';
        ctx.shadowColor = '#ff8800';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(x + 8, cy + 12, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + w - 8, cy + 12, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffaa';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(x + 4, cy + 2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + w - 4, cy + 2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
    }

    function drawCromulon(c) {
        const x = c.x, y = c.y, w = c.width, h = c.height;
        const cx = x + w/2, cy = y + h/2;

        ctx.save();
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.ellipse(cx, cy, w/2, h/2, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#e06040';
        ctx.fill();
        ctx.strokeStyle = '#8b1a1a';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.shadowBlur = 5;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(cx - 16, cy - 8, 14, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 16, cy - 8, 14, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff0000';
        ctx.beginPath();
        ctx.arc(cx - 18, cy - 6, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 18, cy - 6, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(cx - 20, cy - 10, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 16, cy - 10, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy + 10, 18, 0.1, Math.PI - 0.1);
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        for (let i = -12; i <= 12; i += 8) {
            ctx.beginPath();
            ctx.moveTo(cx + i - 3, cy + 6);
            ctx.lineTo(cx + i, cy + 16);
            ctx.lineTo(cx + i + 3, cy + 6);
            ctx.fill();
        }

        ctx.restore();
        ctx.shadowBlur = 0;
    }

    function drawMeteor(m) {
        const x = m.x, y = m.y, r = m.radius;
        const angle = Math.atan2(m.speedY, m.speedX);

        ctx.save();
        const tailLen = r * 4.5;
        const grad = ctx.createRadialGradient(
            x, y, 0,
            x - Math.cos(angle) * tailLen * 0.4,
            y - Math.sin(angle) * tailLen * 0.4,
            tailLen
        );
        grad.addColorStop(0, 'rgba(255, 200, 50, 0.9)');
        grad.addColorStop(0.3, 'rgba(255, 120, 0, 0.6)');
        grad.addColorStop(0.7, 'rgba(255, 50, 0, 0.3)');
        grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(
            x - Math.cos(angle) * tailLen * 0.3,
            y - Math.sin(angle) * tailLen * 0.3,
            tailLen, r * 0.8, angle, 0, Math.PI * 2
        );
        ctx.fill();

        ctx.shadowColor = '#ff8800';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#6b4a3c';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#3d2b1f';
        ctx.beginPath();
        ctx.arc(x - r*0.3, y - r*0.2, r*0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + r*0.4, y + r*0.3, r*0.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,220,180,0.3)';
        ctx.beginPath();
        ctx.arc(x - r*0.2, y - r*0.3, r*0.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#0b001a');
        grad.addColorStop(0.6, '#1d003b');
        grad.addColorStop(1, '#2a004a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        stars.forEach(star => {
            const flicker = 0.6 + 0.4 * Math.sin(frameCount * star.speed + star.x);
            ctx.globalAlpha = star.alpha * flicker;
            ctx.fillStyle = '#c8e6ff';
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        ctx.globalAlpha = 0.08;
        ctx.fillStyle = '#aa66ff';
        ctx.beginPath();
        ctx.arc(60, 80, 120, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff66aa';
        ctx.beginPath();
        ctx.arc(340, 500, 100, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }

    // ============================================================
    // Логика игры
    // ============================================================

    function resetGame() {
        score = 0;
        lives = 3;
        cruiser.y = 250;
        cruiser.velocityY = 0;
        cromulons = [];
        meteors = [];
        lastSpawnCromulon = Date.now();
        lastSpawnMeteor = Date.now();
        invincible = false;
        invincibleTimer = 0;
        gameState = STATE.PLAYING;
    }

    function spawnCromulon() {
        const maxY = H - 80;
        // Скорость зависит от счёта: каждые 100 очков +0.5 к базе
        const speedBonus = Math.floor(score / 100) * 0.5;
        const baseSpeed = 3.5 + Math.random() * 1.5;
        cromulons.push({
            x: W + 30,
            y: Math.random() * maxY,
            width: 60,
            height: 80,
            speed: baseSpeed + speedBonus,
            scored: false
        });
    }

    function spawnMeteor() {
        const fromLeft = Math.random() > 0.5;
        const startX = fromLeft ? -40 : W + 40;
        const startY = Math.random() * 150 - 50;
        const angle = fromLeft ? (Math.PI / 4 + Math.random() * 0.3) : (Math.PI * 3/4 - Math.random() * 0.3);
        const speed = 2.0 + Math.random() * 2.5;
        meteors.push({
            x: startX,
            y: startY,
            radius: 10 + Math.random() * 16,
            speedX: Math.cos(angle) * speed,
            speedY: Math.sin(angle) * speed,
        });
    }

    function update() {
        const now = Date.now();

        if (gameState === STATE.MENU) {
            cruiser.y = 280 + Math.sin(now / 250) * 12;
            cruiser.tilt = Math.sin(now / 300) * 0.1;
            return;
        }

        if (gameState === STATE.PLAYING) {
            // Физика игрока
            cruiser.velocityY += cruiser.gravity;
            cruiser.y += cruiser.velocityY;
            if (cruiser.y < 0) { cruiser.y = 0; cruiser.velocityY = 0; }
            if (cruiser.y + cruiser.height > H) {
                loseLife();
                if (gameState === STATE.GAMEOVER) return;
            }
            cruiser.tilt = cruiser.velocityY * 0.03;

            // Спавн Кромулонов (опасные)
            if (now - lastSpawnCromulon > CROMULON_DELAY) {
                spawnCromulon();
                lastSpawnCromulon = now;
            }

            // Спавн метеоритов (декоративные)
            if (now - lastSpawnMeteor > METEOR_DELAY) {
                spawnMeteor();
                lastSpawnMeteor = now;
            }

            // Движение Кромулонов + столкновение
            for (let i = cromulons.length - 1; i >= 0; i--) {
                const c = cromulons[i];
                c.x -= c.speed;
                if (!c.scored && c.x + c.width < cruiser.x) {
                    c.scored = true;
                    score += 10;
                    // Проверка на победу
                    if (score >= 1000) {
                        gameState = STATE.WIN;
                        // Обновляем рекорд
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('schwiftyHighScore', highScore);
                        }
                        return; // останавливаем обновление
                    }
                }
                // Столкновение (если не неуязвим)
                if (!invincible &&
                    cruiser.x < c.x + c.width &&
                    cruiser.x + cruiser.width > c.x &&
                    cruiser.y < c.y + c.height &&
                    cruiser.y + cruiser.height > c.y) {
                    loseLife();
                    if (gameState === STATE.GAMEOVER) return;
                }
                if (c.x < -100) cromulons.splice(i, 1);
            }

            // Движение метеоритов – без столкновения
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.x += m.speedX;
                m.y += m.speedY;
                if (m.x < -100 || m.x > W + 100 || m.y < -100 || m.y > H + 100) {
                    meteors.splice(i, 1);
                }
            }

            // Неуязвимость
            if (invincible) {
                invincibleTimer -= 16;
                if (invincibleTimer <= 0) {
                    invincible = false;
                    invincibleTimer = 0;
                }
            }

            // Обновление рекорда (если не победа)
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('schwiftyHighScore', highScore);
            }
        }
        // Состояние WIN не обновляется (игра заморожена)
    }

    function loseLife() {
        lives--;
        if (lives <= 0) {
            gameState = STATE.GAMEOVER;
        } else {
            cruiser.y = 250;
            cruiser.velocityY = 0;
            invincible = true;
            invincibleTimer = 2000;
            cromulons = [];
            meteors = [];
        }
    }

    // ============================================================
    // Рендеринг
    // ============================================================

    function render() {
        ctx.clearRect(0, 0, W, H);
        drawBackground();

        // Рисуем декоративные метеориты (всегда)
        meteors.forEach(m => drawMeteor(m));

        if (gameState === STATE.MENU) {
            // Меню
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ffdd00';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 36px "Arial Black", sans-serif';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.strokeText('PLANET MUSIC', W/2, 190);
            ctx.fillText('PLANET MUSIC', W/2, 190);

            ctx.shadowBlur = 10;
            ctx.fillStyle = '#00ffcc';
            ctx.font = 'bold 20px "Arial Black", sans-serif';
            ctx.strokeText('CROMULON ATTACK', W/2, 235);
            ctx.fillText('CROMULON ATTACK', W/2, 235);

            drawCruiser();

            const btnX = 80, btnY = 390, btnW = 240, btnH = 60;
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff0055';
            ctx.fillStyle = '#ff0055';
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px "Arial Black", sans-serif';
            ctx.fillText('START SHOW', W/2, btnY + 40);

            ctx.fillStyle = '#aaaaaa';
            ctx.font = '14px Arial';
            ctx.fillText('Tap or click', W/2, 500);
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left';
            return;
        }

        // Рисуем Кромулонов (кроме экрана победы, но можно и рисовать)
        if (gameState !== STATE.WIN) {
            cromulons.forEach(c => drawCromulon(c));
        }

        // Рисуем игрока (с миганием при неуязвимости)
        if (gameState === STATE.PLAYING && invincible && Math.floor(Date.now() / 150) % 2 === 0) {
            // не рисуем
        } else if (gameState !== STATE.WIN) {
            drawCruiser();
        } else {
            // При победе тоже рисуем тарелку (для красоты)
            drawCruiser();
        }

        // Интерфейс
        ctx.textAlign = 'left';
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#000000';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px "Arial Black", sans-serif';
        ctx.fillText('SCORE: ' + score, 15, 35);
        ctx.fillStyle = '#ffcc00';
        ctx.fillText('BEST: ' + highScore, 15, 60);

        for (let i = 0; i < lives; i++) {
            ctx.fillStyle = '#ff3344';
            ctx.font = '24px Arial';
            ctx.fillText('❤️', W - 30 - i * 30, 40);
        }

        // ---- Экраны GAMEOVER и WIN ----
        if (gameState === STATE.GAMEOVER) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = 'center';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff0033';
            ctx.fillStyle = '#ff0033';
            ctx.font = 'bold 40px "Arial Black", sans-serif';
            ctx.fillText('💀 BOO!', W/2, 230);
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 24px "Arial Black", sans-serif';
            ctx.fillText('DISQUALIFIED', W/2, 290);
            ctx.fillStyle = '#ffffff';
            ctx.font = '20px Arial';
            ctx.fillText('Score: ' + score, W/2, 340);
            ctx.fillStyle = '#aaaaaa';
            ctx.font = '16px Arial';
            ctx.fillText('Tap anywhere to retry', W/2, 500);
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left';
        }

        if (gameState === STATE.WIN) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffdd00';
            ctx.fillStyle = '#ffdd00';
            ctx.font = 'bold 48px "Arial Black", sans-serif';
            ctx.fillText('🏆 VICTORY!', W/2, 200);
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px "Arial Black", sans-serif';
            ctx.fillText('Ты убежал!', W/2, 260);
            ctx.fillStyle = '#88ff88';
            ctx.font = 'bold 22px "Arial", sans-serif';
            ctx.fillText('Бонусный флаг:', W/2, 310);
            ctx.fillStyle = '#ffffaa';
            ctx.font = 'italic 26px "Comic Sans MS", cursive, sans-serif';
            ctx.fillText('Easy peasy lemon squeezy', W/2, 360);
            ctx.fillStyle = '#aaaaaa';
            ctx.font = '16px Arial';
            ctx.fillText('Tap anywhere to continue', W/2, 500);
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left';
        }
    }

    // ============================================================
    // Полифилл roundRect
    // ============================================================
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (r > w/2) r = w/2;
            if (r > h/2) r = h/2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };
    }

    // ============================================================
    // Обработка ввода
    // ============================================================
    function handlePointer(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        const touchX = (e.clientX - rect.left) * scaleX;
        const touchY = (e.clientY - rect.top) * scaleY;

        if (gameState === STATE.MENU) {
            if (touchX >= 80 && touchX <= 320 && touchY >= 390 && touchY <= 450) {
                resetGame();
            }
        } else if (gameState === STATE.PLAYING) {
            cruiser.velocityY = cruiser.jump;
        } else if (gameState === STATE.GAMEOVER || gameState === STATE.WIN) {
            // При нажатии на GAMEOVER или WIN возвращаемся в меню
            gameState = STATE.MENU;
        }
    }

    canvas.addEventListener('pointerdown', handlePointer);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        if (touch) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const touchX = (touch.clientX - rect.left) * scaleX;
            const touchY = (touch.clientY - rect.top) * scaleY;
            const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY, preventDefault: () => {} };
            handlePointer(fakeEvent);
        }
    }, { passive: false });

    // ============================================================
    // Главный цикл
    // ============================================================
    function gameLoop() {
        frameCount++;
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
